Infra:
  name: flext-infra
  # Seeded into a new project's pyproject by `codegen new`; every later change
  # goes through `make release` (the protocol is the only version writer).
  initial_project_version: "0.1.0"
  # Release protocol policy (declared data, aihub-ioijy.9). This workspace
  # publishes the flext-* member distributions; a consumer repository leaves the
  # tuple empty and every resolved project becomes a candidate. `bump_types` and
  # `publish_url` keep their Conventional Commits / PyPI typed defaults.
  release:
    publishable_prefixes:
      - flext-
    # Hash-pinned build backend for the isolated release build
    # (`uv build --build-constraints … --require-hashes`); projected into every
    # repository as config/build-constraints.txt (flext-to3n7).
    build_constraints:
      - name: hatchling
        version: 1.32.0
        hashes:
          - 0bdbde4a52b06c37e3eca395f85a762bf0ef06fe374fd8ae429dc6be10230f5f
          - 0e17c9c3b9aa7c625acc8d0f5b622f107d5049af9ecf5ada4de1aada5be7cdbc
      - name: packaging
        version: "26.3"
        hashes:
          - 94edc256424af38762eb31306eed28beb9f0efc50a8837492c9d6fd6004aed79
          - d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c
      - name: pathspec
        version: 1.1.1
        hashes:
          - 17db5ecd524104a120e173814c90367a96a98d07c45b2e10c2f3919fff91bf5a
          - a00ce642f577bf7f473932318056212bc4f8bfdf53128c78bbd5af0b9b20b189
      - name: pluggy
        version: 1.6.0
        hashes:
          - 7dcc130b76258d33b90f61b658791dede3486c3e6bfb003ee5c9bfb396dd22f3
          - e920276dd6813095e9377c0bc5566d94c932c33b27a3e3945d8389c374dd4746
      # hatchling 1.32.0 added tomlkit to its own requirements; under
      # `--require-hashes` every resolved build dependency must be pinned here
      # or the isolated build fails to resolve.
      - name: tomlkit
        version: 0.15.1
        hashes:
          - 177a05aece5a8ca5266fd3c448abb47b8d352f09d477d3ca8332db4d89b24304
          - e25bbf38843005246210a12982776f27f99cb9be67160e14434d0c0d21ee1e97
      - name: trove-classifiers
        version: 2026.6.1.19
        hashes:
          - ab4c4ec93cc4a4e7815fa759906e05e6bb3f2fbd92ea0f897288c6a43efd15b3
          - c5132b4b61a829d11cfbd2d72e97f20a45ed6edb95e45c5efdeb5e00836b2745
  source_scan:
    roots:
      - src
      - scripts
    # NOTE (flext-jnm1.1 / flext-jnm1.4): ignored_resources was removed; the names
    # now derive from the codegen artifact SSOT (config/codegen.yaml artifacts
    # with source_scan_ignore=true) via CodegenConfigSpec.source_scan_ignored.
  # flext-j47u (codex): every static rule is validated data; the detector owns no policy.
  enforcement:
    rules:
      - {operator: import_module, module: pydantic, owner_project: flext-core,
         kind: direct_pydantic_import, detail: "Use the canonical m/u facades outside flext-core."}
      - {operator: import_module, module: structlog, owner_project: flext-core,
         kind: direct_structlog_import, detail: "Use u.fetch_logger outside flext-core."}
      - {operator: import_module, module: oracledb, owner_project: flext-db-oracle,
         kind: direct_oracledb_import, detail: "Use the canonical database facade."}
      - {operator: import_module, module: ldap3, owner_project: flext-ldap,
         kind: direct_ldap3_import, detail: "Use the canonical LDAP facade."}
      - {operator: import_module, module: pdb, kind: breakpoint,
         detail: "Debugger imports are forbidden in production source."}
      - {operator: import_member, module: typing, member: Dict, kind: typing_dict_import,
         detail: "Use the canonical t mapping alias or an m/p contract."}
      - {operator: import_member, module: typing, member: List, kind: typing_list_import,
         detail: "Use the canonical t sequence alias."}
      - {operator: attribute, module: typing, member: Dict, kind: typing_dict_attr,
         detail: "Use the canonical t mapping alias or an m/p contract."}
      - {operator: attribute, module: typing, member: List, kind: typing_list_attr,
         detail: "Use the canonical t sequence alias."}
      - {operator: call, name: print, kind: print,
         detail: "Use structured logging in production source."}
      - {operator: call, name: breakpoint, kind: breakpoint,
         detail: "Remove breakpoint calls from production source."}
      - {operator: call_keyword, name: open, keyword: encoding, kind: open_encoding,
         detail: "Pass an explicit encoding keyword to open."}
      - {operator: annotation, name: dict, kind: dict_annotation,
         detail: "Use the owning m model through its p protocol."}
      - {operator: bare_except, kind: bare_except,
         detail: "Declare the exact exception contract instead of bare except."}
      - {operator: annotated_string, name: __version__, kind: hardcoded_version,
         detail: "Resolve package versions through importlib.metadata."}
      - {operator: comment, marker: "# type: ignore", kind: type_ignore,
         detail: "Fix the underlying typing contract instead of suppressing it."}
      - {operator: comment, marker: "# noqa", kind: noqa,
         detail: "Fix the underlying lint defect instead of suppressing it."}
