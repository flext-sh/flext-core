        - legado
        - b-pipeline
        - debug-pipeline
        - exec-pipeline
        - noexec-pipeline
        - probe
        - status-pipeline
      archive_globs:
        - "*.log"
        - pytest_*.txt
        - pyright_errors*.log
        - test_output.txt
        - mro-to59-*
      # Content submodule trees and agent law dirs are out of product-docs relocate.
      # .agents is already skipped via allow_hidden (dotdir); data/ is explicit.
      special_root_dirs:
