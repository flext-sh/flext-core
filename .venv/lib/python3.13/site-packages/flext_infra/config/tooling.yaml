Infra:
  tooling:
    # flext-j47u (codex): canonical validated tooling and suppression-policy SSOT.
    tools:
      codespell:
        check-filenames: true
        ignore-words-list: crate,nd
      # flext-j47u (codex): non-linter tool sections are config-owned as well.
      deptry:
        known-first-party: [flext_core]
        pep621-dev-dependency-groups: [dev]
      hatch:
        allow-direct-references: true
        packaged-data-dirs: [config, templates]
      markdown:
        rules:
          default: true
          MD001: false
          MD013:
            line_length: 500
            heading_line_length: 200
            code_block_line_length: 500
            tables: false
          MD022: false
          MD023: false
          MD024: { siblings_only: true }
          MD025: false
          MD031: false
          MD033: { allowed_elements: [br, details, summary, kbd] }
          MD036: false
          MD040: false
          MD041: false
          MD042: false
          MD046: false
          MD050: { style: consistent }
          MD051: false
          MD057: false
          MD060: false
          MD076: false
        exclude:
          - .omo/**
          - .tmp/**
          - .claude/**
          - .vscode/**
          - .codegraph/**
          - .code-review-graph/**
          - .serena/**
          - .snapshots/**
          - .benchmarks/**
          - .hypothesis/**
          - .mypy_cache/**
          - .pytest_cache/**
          - .ruff_cache/**
          - .venv/**
          - __pycache__/**
          - node_modules/**
          - .reports/**
          - dist/**
          - build/**
          - htmlcov/**
          - legado/**
          - .github/**
          - site/**
      ruff:
        # P0 law: lint covers every tracked Python surface. No excludes over
        # legado, examples, tests, or scripts code anywhere in this config.
        exclude:
          - .git
          - .mypy_cache
          - .pytest_cache
          - .ruff_cache
          - .venv
          # Historical evidence is never a live lint surface.
          - .archive
          - .archive/**
          - "**/.archive/**"
          - __pycache__
          - "**/__pyrefly_virtual__/**"
          - archive
          - backup
          - build
          - dist
          - htmlcov
          - temp-backup
          - typings
          - vendor
          - venv
          - backup
          - build
          - dist
          - htmlcov
          - temp-backup
          - typings
          - vendor
          - venv
        # tests, examples, and scripts are dev/tooling source roots (see `src`
        # below), not installed packages: they hold namespace/command modules
        # loaded by path (e.g. the scripts/<verb>/<what> dispatch pattern), so
        # ruff must not demand an __init__.py (INP001) there.
        namespace-packages: [tests, examples, scripts]
        fix: false
        line-length: 88
        preview: true
        respect-gitignore: true
        show-fixes: true
        src: [src, tests, examples, scripts]
        target-version: py313
        format:
          docstring-code-format: true
          indent-style: space
          line-ending: lf
          quote-style: double
          skip-magic-trailing-comma: true
        lint:
          select:
            - ALL
          # flext-j47u (codex): banned API messages are policy data, never template literals.
          banned-api:
            argparse: "Use cli.register_result_command + Pydantic model from flext_cli."
            click:
              "Use flext_cli.cli application, registration, execution, and invocation\
              \ methods."
            rich: "Use cli.print / cli.display_message / cli.render_panel / cli.render_table."
            typer: "Use cli.create_app_with_common_params / cli.register_command from flext_cli."
          ignore:
            - ambiguous-unicode-character-comment
            - ambiguous-unicode-character-docstring
            - ambiguous-unicode-character-string
            - boolean-positional-value-in-call
            - camelcase-imported-as-lowercase
            - complex-structure
            - docstring-missing-exception
            - docstring-missing-returns
            - docstring-missing-yields
            - incorrect-blank-line-before-class
            - line-too-long
            - logging-f-string
            - missing-copyright-notice
            - missing-trailing-comma
            - multi-line-summary-second-line
            - no-self-use
            - non-imperative-mood
            # Autouse is the correct contract for suite-wide isolation guards:
            # requiring every test to opt in would let live state leak whenever
            # one consumer omitted the fixture.
            - pytest-fixture-autouse
            - too-many-arguments
            - too-many-branches
            - too-many-locals
            - too-many-nested-blocks
            - too-many-positional-arguments
            - too-many-public-methods
            - too-many-return-statements
            - too-many-statements
            - typing-only-first-party-import
            - typing-only-standard-library-import
            - typing-only-third-party-import
          ignored-rule-rationales:
            unsorted-imports:
              Ruff sorts TYPE_CHECKING imports lexically and reverses the mandatory
              semantic c-t-p-m-u dependency order in FLEXT facades.
            import-outside-top-level:
              Public facade models are imported lazily only at validation and
              construction sites to preserve the c-t-p-m-u graph and prevent runtime cycles.
          isort:
            combine-as-imports: true
            force-single-line: false
            split-on-trailing-comma: false
          per-file-ignores:
            # No blanket mask is declared here. `**/.vulture_whitelist.py` and
            # `**/*_pb2*.py` previously carried [ALL]; neither glob matches a
            # tracked file in any governed project, and vendored copies live
            # under `.venv`, which `exclude` already removes from the lint
            # surface. A vendored generated file that ever becomes tracked gets
            # its rules named here, per UNIVERSAL_CORE r19.
            # Examples are executable documentation loaded by path, not
            # importable modules, so module-name and shebang rules do not apply.
            "**/examples/**/*.py": [invalid-module-name, shebang-not-executable]
            # The rope PEP 695 exemption is NOT declared here: this file is the
            # FLEET policy, and a path that exists only in flext-infra would be
            # written into every generated project's pyproject.toml. It lives in
            # flext-infra's own config/quality.yaml as a project-local
            # ManagedArtifacts.Ruff addition, which conform merges over this
            # policy for that one repository.
            # Test suites: pytest idioms that are correct-by-design
            # are exempted GLOBALLY at the codegen SSOT (operator P0, per-rule
            # justified per UNIVERSAL_CORE r19 — never a blanket mask):
            #  - assert: bare assertions are pytest's executable assertion
            #    mechanism. Projects may adopt flext-tests matchers, but codegen
            #    must remain valid for every generated and external consumer.
            #  - undocumented-public-method/-function/-class: test methods,
            #    helper functions, and TestsXxx container classes are structural,
            #    not public API, so docstrings add no value.
            #  - magic-value-comparison (PLR2004): tests compare literal
            #    expected values; extracting every literal to a
            #    named constant harms readability and is not real code debt.
            #  - compare-to-empty-string (PLC1901): matcher calls can validate
            #    an exact empty-string result directly.
            # NOT exempted, and deliberately so: suspicious-subprocess-import
            # (S404). u.Cli.run / run_raw / run_checked / run_live is the only
            # canonical process boundary in FLEXT; importing subprocess directly
            # — including in tests, to fake a runner — is a violation, not an
            # idiom. A test fakes the CANONICAL runner, never subprocess itself.
            # NOT exempted (real defects, fixed in test code): import-private-name
            # (PLC2701) and private-member-access (SLF001) — tests must exercise the
            # PUBLIC facade only (flext test public-only law).
            "**/tests/**":
              - assert
              - compare-to-empty-string
              - magic-value-comparison
              - undocumented-public-class
              - undocumented-public-function
              - undocumented-public-method
            # Generated PEP 562 lazy facade roots intentionally re-export and
            # synthesize package members; only rules incompatible with that
            # canonical facade contract are excluded here.
            "**/__init__.py":
              - any-type
              - builtin-import-shadowing
              - implicit-namespace-package
              - import-private-name
              - invalid-module-name
              - non-empty-init-module
              - runtime-import-in-type-checking-block
              - undefined-export
              - undefined-local-with-import-star
              - undefined-local-with-import-star-usage
              - undocumented-public-init
              - unused-import

      mypy:
        plugins: [pydantic.mypy]
        # flext-j47u: every retained global exclusion carries its tested rationale;
        # generated pyprojects receive this evidence as managed comments.
        boolean-settings:
          namespace_packages: true
          explicit_package_bases: true
          check_untyped_defs: true
          # disallow_untyped_defs, Noisier flags
          # disallow_any_unimported, Noisier flags
          extra_checks: true
          local_partial_types: true
          no_implicit_reexport: true
          show_traceback: true
          # strict_concatenate is deprecated in mypy 1.20+; extra_checks covers it
          strict_equality: true
          warn_redundant_casts: true
          warn_return_any: true
          warn_unreachable: true
          warn_unused_ignores: true
        disabled-error-codes:
          assignment: Dependency-injector descriptors lose their FLEXT-bound type only in Mypy.
          attr-defined: PEP 562 facade members installed by FLEXT composition are invisible to Mypy.
          call-arg: Pydantic v2 init signatures behind facade FLEXT are incomplete in Mypy.
          misc: Valid PEP 695 nested facade aliases are rejected under Mypy's misc bucket.
          name-defined: Generated PEP 562 exports are installed at runtime but absent to Mypy.
          prop-decorator: Mypy loses Pydantic computed-field descriptors across composed FLEXT.
          valid-type: Mypy rejects facade namespaces used as owners in valid PEP 695 aliases.
        string-settings:
          follow_imports: normal
        overrides:
          # Fail-loud exhaustive enum dispatch (ADR-001): Mypy over-narrows
          # the enum through the branch chain and flags the live defensive
          # guard as unreachable; the guard is the required runtime contract
          # for future ChartPrimitive members.
          - modules:
              ["dcdoc._utilities._charts._matplotlib_renderer._renders_spec"]
            disable-error-codes: [unreachable]
            justification: >-
              Mypy over-narrows exhaustive ChartPrimitive dispatch and
              rejects the live fail-loud guard (ADR-001) as unreachable;
              the guard is the required runtime contract for future enum
              members (documented rationale in the consumer pyproject).
      pydantic-mypy:
        init_forbid_extra: true
        init_typed: true
        warn_required_dynamic_aliases: true
        warn-untyped-fields: true
      pyright:
        strict-settings:
          pythonPlatform: Linux
          pythonVersion: "3.13"
          typeCheckingMode: strict
        extended-settings:
          reportArgumentType: "none"
          reportAttributeAccessIssue: "none"
          reportCallIssue: "none"
          reportConstantRedefinition: error
          reportIncompatibleMethodOverride: error
          reportIncompatibleVariableOverride: "none"
          reportInconsistentConstructor: error
          reportInvalidTypeForm: "none"
          reportMissingImports: error
          reportMissingModuleSource: error
          reportMissingTypeStubs: "none"
          reportPrivateUsage: warning
          reportUnknownArgumentType: "none"
          reportUnknownLambdaType: "none"
          reportUnknownMemberType: "none"
          reportUnknownParameterType: "none"
          reportUnknownVariableType: "none"
          reportUnnecessaryCast: error
          reportUnnecessaryComparison: warning
          reportUnnecessaryIsInstance: warning
          reportUnreachable: "none"
          reportUnsupportedDunderAll: "none"
          reportUntypedBaseClass: "none"
          reportUntypedFunctionDecorator: "none"
          reportUnusedClass: error
          reportUnusedFunction: error
          reportUnusedImport: error
          reportUnusedVariable: error
        lazy-import-suppressions:
          reportAssignmentType: "none"
          reportAttributeAccessIssue: "none"
          reportGeneralTypeIssues: "none"
          reportInvalidTypeForm: "none"
          reportPrivateImportUsage: "none"
          reportUnknownArgumentType: "none"
          reportUnknownLambdaType: "none"
          reportUnknownMemberType: "none"
          reportUnknownParameterType: "none"
          reportUnknownVariableType: "none"
          reportUnusedImport: "none"
        global-suppression-rationales:
          reportAssignmentType:
            Pyright rejects the canonical class-alias rebind after
            FLEXT facade composition although runtime and the other analyzers resolve it.
          reportGeneralTypeIssues:
            Pyright groups the same valid FLEXT facade alias rebind
            under its broad general diagnostic in every execution environment.
        source-env-suppressions:
          reportReturnType: "none"
        test-like-env-suppressions:
          reportArgumentType: "none"
          reportReturnType: "none"
        path-rules:
          # flext-wkii.17 (codex): source and tracked consumer surfaces are all
          # first-class environments so no analyzer can hide their diagnostics.
          source-dir: src
          project-root: .
          env-dirs: [src, tests, examples, scripts]
          test-like-dirs: [tests, examples, scripts]
          default-excludes:
            - "**/node_modules"
            - "**/__pycache__"
            - "**/__pyrefly_virtual__/**"
            - "**/.mypy_cache"
            - "**/.ruff_cache"
            - "**/.pytest_cache"
            - "**/.*"
            - .git
            - .reports
            - vendor
            - .venv
            - "**/.venv"
            - "**/.venv/**"
            - "**/venv"
            - "**/venv/**"
            - "**/site-packages"
            - "**/site-packages/**"
            - "**/dist-packages"
            - "**/dist-packages/**"
            - "**/tests/fixtures"
            - "**/tests/fixtures/**"
          root-typings-paths: []
          project-typings-paths: []
          ignored-diagnostic-globs: []
          # flext-j47u (codex): Rope 1.14/latest has no public PEP 695 walker
          # registration API. This existing-path-only environment is the tested
          # vendor boundary; broad src code keeps reportPrivateUsage=error.
          diagnostic-path-overrides:
            - root: src/flext_infra/_utilities/_rope
              reportPrivateUsage: "none"
              rationale: >-
                Rope 1.14 and upstream master require private walker handler
                registration for Python 3.13 PEP 695 source regions.
          source-report-private-usage: error
          test-like-report-private-usage: "none"
          other-report-private-usage: "none"
          venv-name: .venv
      coverage:
        source: [src]
        fail-under:
          core: 45
          domain: 30
          platform: 45
          integration: 20
          app: 15
        show-missing: true
        skip-covered: false
        precision: 2
        exclude-also:
          - "if _t.TYPE_CHECKING:"
          - "if TYPE_CHECKING:"
          - "if typing.TYPE_CHECKING:"
        omit:
          - "*/dependency_injector/providers.pyx"
          # Declaration-layer Protocol facades have no runtime behavior to cover.
          - "*/protocols.py"
          - "*/_protocols/*"
      pyrefly:
        disable-project-excludes-heuristics: true
        python-version: "3.13"
        use-ignore-files: false
        strict-errors:
          # --- type safety ---
          - bad-argument-count
          - bad-argument-type
          - bad-assignment
          - bad-class-definition
          - bad-context-manager
          - bad-dunder-all
          - bad-function-definition
          - bad-index
          - bad-instantiation
          - bad-keyword-argument
          - bad-match
          - bad-param-name-override
          - bad-raise
          - bad-return
          - bad-specialization
          - bad-typed-dict
          - bad-typed-dict-key
          - bad-unpacking
          - deprecated
          - implicit-abstract-class
          - implicit-any
          - implicit-import
          - implicitly-defined-attribute
          - inconsistent-inheritance
          - inconsistent-overload
          - invalid-annotation
          - invalid-argument
          - invalid-decorator
          - invalid-inheritance
          - invalid-literal
          - invalid-overload
          - invalid-param-spec
          - invalid-pattern
          - invalid-self-type
          - invalid-super-call
          - invalid-type-alias
          - invalid-type-var
          - invalid-type-var-tuple
          - invalid-variance
          - invalid-yield
          - missing-argument
          - missing-attribute
          - missing-import
          - missing-module-attribute
          - missing-override-decorator
          - missing-source
          - missing-source-for-stubs
          - no-access
          - no-matching-overload
          - not-a-type
          - not-async
          - not-callable
          - not-iterable
          - not-required-key-access
          - open-unpacking
          - protocol-implicitly-defined-attribute
          - read-only
          - redefinition
          - redundant-cast
          - redundant-condition
          - unannotated-attribute
          - unannotated-parameter
          - unannotated-return
          - unbound-name
          - unexpected-keyword
          - unexpected-positional-argument
          - unknown-name
          - unnecessary-comparison
          - unnecessary-type-conversion
          - unreachable
          - unresolvable-dunder-all
          - unsafe-overlap
          - unsupported
          - unsupported-delete
          - unsupported-operation
          - untyped-import
          - unused-coroutine
          - unused-ignore
          - variance-mismatch
          - inconsistent-overload-default
        project-exclude-globs:
          - "**/__pycache__"
          - "**/__pyrefly_virtual__/**"
          - "**/node_modules"
          - "**/.venv/**"
          - "**/*_pb2*.py"
          - "**/*_pb2_grpc*.py"
          - "**/site-packages/**"
          - "**/typings/**"
          - "**/venv/**"
          - "**/vendor/**"
          - ".venv/**"
          - "typings/**"
          - "vendor/**"
        path-rules:
          env-dirs: [src, tests, examples, scripts]
          source-dir: src
          project-root: .
          root-typings-paths: []
          project-typings-paths: []
          workspace-include-children: false
          workspace-include-child-env-dirs: []
          # Why (flext-463 follow-up): scripts/ is a checked env dir, so its
          # runtime sys.path imports (e.g. `from lib...`) must also resolve at
          # check time; absent dirs are filtered by the is_dir guard.
          # Amended 2026-08-31 (cosmos-45hiv): now EMPTY. Two rounds of
          # evidence emptied it. "." first: scripts/ owns scripts/__init__.py,
          # so every script module resolves as `scripts.*` with the repo root
          # as CWD, and "." made the same file reachable a second way
          # (`legado.lib.argocd` vs `scripts.legado.lib.argocd`), which mypy
          # reports as source-file-found-twice and dies repo-wide. "scripts"
          # second: with that entry on the search path, `scripts/` becomes a
          # search-path ROOT, so `scripts/legado/lib/argocd.py` resolves once
          # more as `legado.lib.argocd` -- the same duplicate under a different
          # mechanism. scripts/ is analyzed because `files` names it, not
          # because the search path does; import resolution there uses the
          # `scripts.*` package rooted at the CWD. No live consumer of either
          # bare spelling remains; the only importer was the archived
          # scripts/legado/dispatch.py.
          project-shared-search-paths: []
      pytest:
        # flext-j47u (codex): scaffold/modernizer consume one complete pytest model.
        # OPERATOR LAW flext-38p39 (2026-08-13), reaffirmed by flext-09686
        # measurement. 10s per case, 60s for an explicitly slow case, 120s for
        # the complete suite. A case that does not fit is a TEST DEFECT and is
        # OPTIMIZED; raising the ceiling to accommodate it is forbidden and is
        # itself a violation. This supersedes the prior measurement-driven note
        # that told future maintainers to never narrow back to 10s/60s: that
        # rule let the suite run 30 minutes, so make test never aborted on
        # overrun and a push could be attempted without a full green suite.
        case-timeout-seconds: 10
        # The 60s arm of OPERATOR LAW flext-38p39, made executable. The law
        # already granted an explicitly slow case 60s, but no key projected it,
        # so `flext_slow_timeout_seconds` stayed empty and every `@pytest.mark.slow`
        # item was still judged at 10s. A nested `pytester.runpytest_subprocess()`
        # pays a full interpreter + plugin boot before its first assertion and
        # cannot fit 10s; it is not a slow TEST, it is a slow HARNESS. This is
        # the declared exception, not a raised ceiling: unmarked cases keep 10s.
        slow-timeout-seconds: 60
        # Complete-suite wall clock. Individual cases remain bounded at 10s
        # (60s only when explicitly slow); the aggregate receives 600s so the
        # entire parallel suite and coverage finalization can complete. The
        # process wall adds one minute for orderly worker/report shutdown.
        run-timeout-seconds: 600
        termination-grace-seconds: 2
        enforcement-plugin: flext_tests_enforcement
        progress-args: [--verbose]
        report-args: [-ra, --durations=25, --durations-min=0.001, --tb=short]
        diagnostic-args: [-rA, --durations=0, --tb=long, --showlocals]
        # The full suite nests Make, Git, and Python subprocesses. Four workers
        # previously exhausted that process topology, and a 16-worker run on a
        # 20-CPU/63-GiB host produced six independent item timeouts. Two is the
        # highest measured stable ceiling; live CPU and memory remain stricter
        # additional bounds on smaller hosts.
        parallel-workers: 2
        # Reserve physical memory for each xdist worker and its child process
        # tree; this bound may reduce the tested ceiling on smaller hosts.
        parallel-worker-memory-gb: 2
        # Work stealing drains uneven codegen/subprocess tails without the
        # serialized 99% tail measured under loadscope.
        parallel-distribution: worksteal
        profile-sort: cumulative
        profile-limit: 50
        min-version: "8.0"
        python-classes: ["Test*"]
        python-files: ["*_test.py", "*_tests.py", "test_*.py"]
        # Collect once from the canonical test root. The former list ended in
        # `.` and therefore traversed tests, source, docs, examples, scripts,
        # generated reports, and local runtime state a second time. Executable
        # documentation and auxiliary surfaces remain covered by explicit tests
        # and their lint/Markdown gates rather than duplicate pytest discovery.
        test-paths: [tests]
        # pytest applies filterwarnings last-entry-wins; the conform phase +
        # tomlsort alpha-sort filterwarnings, so any override MUST sort AFTER
        # "error" to survive re-conform. Only module::/once:: sort after 'error'
        # ('m'/'o' > 'e'); default::/always::/ignore:: get reordered before it and
        # lose. The entry names FlextMroViolation because FlextSmellViolation is
        # its SUBCLASS: a filter on the child leaves the parent fatal, which is
        # how MRO violations became errors again after a regeneration dropped
        # the hand-added entry from ade37396c. One entry on the parent keeps
        # both VISIBLE-but-non-fatal, matching the non-strict enforcement policy
        # (flext-tests registers default::{category}); all other warnings stay
        # fatal. See flext-core test_enforcement_warning_visibility.
        filter-warnings:
          [error, "module::flext_core._constants.enforcement.FlextMroViolation"]
        standard-markers:
          - "smoke: public-interface smoke tests"
          - "unit: unit tests"
          - "integration: integration tests"
          - "performance: performance and benchmark tests"
          - "slow: slow-running tests"
          - "docker: tests requiring Docker"
          - "remote: tests requiring remote/external network services"
          - "e2e: end-to-end integration tests"
          - "edge_cases: edge case tests"
          - "stress: stress tests"
          - "resilience: resilience tests"
        standard-addopts:
          - --benchmark-disable
          - --strict-markers
          - --markdown-docs
          - --durations=10
          # flext-99ae: --timeout/--session-timeout are runner-owned and derived
          # from case-timeout-seconds/run-timeout-seconds; never restate them here.
        # flext-99ae: hard process boundary independent of pytest hook progress.
        # Must exceed run-timeout-seconds (120) by a small grace only: this caps
        # the whole Make/pytest process (shell `timeout`), not a single session
        # hook. A wide outer wall is itself an escape hatch — it would let an
        # overrun keep burning wall clock instead of aborting. Grace covers
        # interpreter start, collection and teardown only.
        process-timeout-seconds: 660
      tomlsort:
        all: true
        in_place: true
        sort_first: [project, build-system, tool, dependency-groups]
      vulture:
        # NOTE (multi-agent, flext-j47u): Vulture 2.16 reports keyword-bearing
        # Protocol signature parameters as unused variables at 100% confidence,
        # even with --ignore-decorators @runtime_checkable. The declaration-only
        # protocol facet is excluded; production models and runtime code remain scanned.
        exclude: ["*/_protocols/*"]
        min-confidence: 100
        paths: [src]
        verbose: false
      yamlfix:
        line_length: 88
        preserve_quotes: true
        whitelines: 1
        section_whitelines: 1
        explicit_start: false

    project-type-overrides:
      core:
        pyright: {}
      domain:
        pyright:
          reportMissingModuleSource: "warning"
      platform:
        pyright: {}
      integration:
        pyright:
          reportMissingModuleSource: "none"
          reportMissingTypeStubs: "none"
      app:
        pyright: {}
    lazy-init: {}

# Project-local managed-artifact additions for flext-infra itself.
#
# `Infra.tooling` above is the FLEET policy every generated project inherits.
# This block is the same-file project override that conform merges over it for
# THIS repository only, matching how flext-cli and flext-auth declare theirs.
# A path that exists only here belongs in this block, never in the fleet policy:
# declaring it there writes a dead exemption into every project's pyproject.toml.
ManagedArtifacts:
  Ruff:
    per_file_ignores:
      # OPERATOR-AUTHORIZED 2026-08-08 (rope only, private-member-access only).
      # Rope 1.14 and upstream master expose NO public API to register a PEP 695
      # walker handler, so these private slots ARE the library interface.
      # Vendoring the walker and dropping PEP 695 support were the alternatives;
      # the operator rejected both.
      # The access is written LITERALLY and reported honestly: routing it through
