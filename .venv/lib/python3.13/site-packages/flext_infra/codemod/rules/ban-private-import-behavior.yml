# Ban private-module imports in behavior code (epic i2h4 flext-core refactor).
#
# FLEXT law: behavior code (u/ facades, services, api.py, cli.py and every
# module outside the private implementation directories) must consume the
# public facades (c/t/p/m/u + r/e/x/h/d/s), never reach into the private
# `_constants` / `_exceptions` / `_models` / `_typings` / `_utilities`
# implementation modules of another layer. A private import bypasses the
# facade FLEXT and freezes an internal layout that the owner must stay free
# to refactor.
#
# Detection-only: the correct replacement is the public facade symbol the
# private module projects (e.g. `from flext_core import c, m, t, u`).
# The message names the facade surface to use.
#
# Bead: i2h4 (flext-core private-import cutover).

---
id: ban-private-import-behavior
language: Python
severity: error
rule:
  any:
    - all:
        - kind: import_from_statement
        - regex: '^from\s+[\w.]*\._(constants|exceptions|models|typings|utilities)(\.[\w.]+)*\s+import\b'
    - all:
        - kind: import_statement
        - regex: '^import\s+[\w.]*\._(constants|exceptions|models|typings|utilities)(\.[\w.]+)*(\s+as\s+\w+)?\s*$'
message: >-
  Importing from a private implementation module (_constants/_exceptions/
  _models/_typings/_utilities) is banned in behavior code. Use the public
  facade instead (from <pkg> import c, t, p, m, u, r, e, x, h, d, s).
note: >-
  Migration: find the public projection of the imported symbol on the owning
  facade (c=constants, e=exceptions, m=models, t=typings, u=utilities) and
  import it from the package root, e.g. `from flext_core import m` then
  `m.FlextModels...`. If the symbol has no public projection, the private
  module owner must expose one — do not keep the private import.
files:
  - "**/*.py"
ignores:
  - "**/.git/**"
  - "**/.venv/**"
  - "**/__pycache__/**"
