# Migrate ai-hub workspace_git_identity calls to u.Infra.git_identity.
#
# u.AiHub.workspace_git_identity($PATH)
#   → u.Infra.git_identity(m.Infra.GitRepoRequest(repo_root=$PATH))
#
# cls.workspace_git_identity($PATH)
#   → u.Infra.git_identity(m.Infra.GitRepoRequest(repo_root=$PATH))
#
# Field renames (.head_sha → .head_oid, .repository_root → .repo_root) are
# left to pyrefly-driven hand-edit: after the type swap the type checker
# pinpoints every stale attribute access. ast-grep cannot track data flow.
#
# Bead: flext-sb3q (codemod-only governance P0).

---
id: workspace-git-identity-call-to-infra-u
language: Python
rule:
  pattern: u.AiHub.workspace_git_identity($PATH)
fix: u.Infra.git_identity(m.Infra.GitRepoRequest(repo_root=$PATH))
severity: warning
message: Replace workspace_git_identity with u.Infra.git_identity typed facade.
files:
  - "**/*.py"
ignores:
  - "**/.git/**"
  - "**/__pycache__/**"

---
id: workspace-git-identity-call-to-infra-cls
language: Python
rule:
  pattern: cls.workspace_git_identity($PATH)
fix: u.Infra.git_identity(m.Infra.GitRepoRequest(repo_root=$PATH))
severity: warning
message: Replace cls.workspace_git_identity with u.Infra.git_identity typed facade.
files:
  - "**/*.py"
ignores:
  - "**/.git/**"
  - "**/__pycache__/**"
