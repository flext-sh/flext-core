# Ban GitPython imports outside the _git/ owner (epic flext-ga9q).
#
# FLEXT law: all git interaction flows through u.Infra.git_* typed
# Request/Report facade. Consumers must NEVER import GitPython directly.
# The sole owner of GitPython is src/flext_infra/_utilities/_git/.
#
# Detection-only: the correct replacement is the typed semantic method
# that owns the operation. The message names the facade to use.

---
id: ban-gitpython-import-outside-owner
language: Python
rule:
  pattern: import git
severity: error
message: Importing GitPython directly is banned outside the _git/ owner. Use u.Infra.git_* typed facade instead.
files:
  - "**/*.py"
ignores:
  - "src/flext_infra/_utilities/_git/**"
  - "flext-infra/src/flext_infra/_utilities/_git/**"
  - "**/.git/**"
  - "**/__pycache__/**"

---
id: ban-gitpython-from-import-outside-owner
language: Python
rule:
  pattern: from git import $NAME
severity: error
message: Importing from GitPython directly is banned outside the _git/ owner. Use u.Infra.git_* typed facade instead.
files:
  - "**/*.py"
ignores:
  - "src/flext_infra/_utilities/_git/**"
  - "flext-infra/src/flext_infra/_utilities/_git/**"
  - "**/.git/**"
  - "**/__pycache__/**"
