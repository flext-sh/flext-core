# Hardcoded value that belongs to a configuration SSOT.
#
# Operator law: business rules, versions, branches, providers and endpoints are
# owned by config/settings/templates. A module that repeats one of those values
# as a literal creates a second, silent source of truth that drifts from the
# owner - the exact defect class behind the dual dependency-source and the
# consumer-catalog contamination already removed from this engine.
#
# Detection is SHAPE-BASED, never a project name list:
#   * a release-line branch literal (N.N.N-dev / -rc / -alpha / -beta)
#   * a Git clone URL literal (https://<host>/<org>/<repo>.git)
# Both are always derivable from the repository contract a generator already
# receives (RepositoryRef.url) or from the provider catalog (ProviderSpec.branch).
#
# The declaration sites are NOT violations and are excluded by construction:
#   * `_constants/**` and `constants.py` DECLARE the canonical value;
#   * `config/**` and `**/templates/**` are the data/rendering owners;
#   * test fixtures build a repository contract from the catalog, so they read
#     the value rather than repeat it, and any remaining literal there is caught
#     by the same rule (tests are first-class code).
# Detection-only: the correct replacement depends on which SSOT owns the value
# in that context, so an automatic rewrite would guess. The message names the
# owner to read from.
id: hardcoded-ssot-literal
language: python
severity: warning
files:
  - "**/*.py"
ignores:
  - "**/.git/**"
  - "**/.venv/**"
  - "**/_constants/**"
  - "**/constants.py"
  - "**/templates/**"
  - "**/legado/**"
  - "**/legacy/**"
  - "**/node_modules/**"
  - "**/*_pb2.py"
  - "**/*_pb2_grpc.py"
message: >-
  Hardcoded value owned by a configuration SSOT. A release-line branch or a Git
  clone URL must be read from the repository contract the caller already has
  (RepositoryRef.url / ProviderSpec.branch) or from the provider catalog
  (config.<Ns>.codegen.providers), never repeated as a literal. Fix: replace the
  literal with the SSOT read that owns it.
rule:
  all:
    - pattern: $LIT
    - kind: string
    - any:
        - regex: '^(?:"|\x27)\d+\.\d+\.\d+-(?:dev|rc|alpha|beta)[\w.]*(?:"|\x27)$'
        - regex: '^(?:"|\x27)https://[\w.-]+/[\w.-]+/[\w.-]+\.git(?:"|\x27)$'
    # Only a value BOUND to a contract field is a duplicated source of truth.
    # A literal passed positionally is the input of the function under test
    # (e.g. release_tag_from_branch("0.11.0-dev"), parse_semver("1.2.3-beta"))
    # and is legitimate data, never a second SSOT.
    - inside:
        any:
          - kind: keyword_argument
          - kind: pair
          - kind: assignment
        stopBy: end
