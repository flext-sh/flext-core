# GitPython FLEXT demotion guard (workspace epic flext-ga9q, member flext-infra-a8q).
#
# The raw-argv surface `git_run` / `git_capture` / `git_capture_bytes` was
# demoted off the public utilities facade: argv execution is PRIVATE and lives
# as module-level functions in `flext_infra._utilities._git.repo` only. The
# public Git surface is typed semantic methods (`u.Infra.git_status` and
# siblings) with one `m.Infra.Git*Request` in and one monomorphic
# `m.Infra.Git*Report` out - never raw argv.
#
# Detection is RECEIVER-BASED, never a bare-name ban: the two demoted public
# receivers are exactly `u.Infra` and `FlextInfraUtilitiesGit`. The private
# module functions legitimately keep the same names under
# `src/flext_infra/_utilities/_git/`, so a bare `git_capture(...)` call is the
# canonical shape there and must NOT match.
#
# Two sibling rules, one canonical file (SSOT):
#   R1 git-public-argv-facade-call (error, detection-only)
#      Bans the demoted receivers invoking the argv trio anywhere. No fix: the
#      correct replacement is the typed semantic method that owns the
#      operation (or, in tests that exercise the execute layer itself, the
#      private module function) - an automatic rewrite would guess.
#   R2 git-public-argv-receiver-strip (warning, mechanical fix, tests only)
#      The mechanical half of the demotion for tests that intentionally cover
#      the private execute layer: drop the demoted facade receiver and call
#      the private module function directly. ast-grep cannot insert the
#      companion import (`from flext_infra._utilities._git.repo import ...`)
#      in the same pass, so the import is the deliberate manual half. The fix
#      is idempotent: it removes its own trigger receiver, so a re-scan finds
#      zero.
id: git-public-argv-facade-call
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/.git/**"
  - "**/.venv/**"
  - "**/node_modules/**"
  - "**/*_pb2.py"
  - "**/*_pb2_grpc.py"
message: >-
  Public argv Git execution was demoted off the facade: git_run / git_capture
  / git_capture_bytes are private module functions of
  flext_infra._utilities._git.repo, never u.Infra / FlextInfraUtilitiesGit
  methods. Fix: route the operation through the typed semantic surface
  (u.Infra.git_status and siblings, one m.Infra.Git*Request and one
  monomorphic m.Infra.Git*Report); only tests of the execute layer itself may
  import the private module function directly.
rule:
  pattern: $RECV.$METHOD($$$ARGS)
constraints:
  RECV:
    regex: '^(?:u\.Infra|FlextInfraUtilitiesGit)$'
  METHOD:
    regex: '^git_(?:run|capture|capture_bytes)$'
---
# R2: tests covering the private execute layer drop the demoted receiver.
id: git-public-argv-receiver-strip
language: python
severity: warning
files:
  - "**/tests/**/*.py"
ignores:
  - "**/.git/**"
  - "**/.venv/**"
  - "**/node_modules/**"
  - "**/*_pb2.py"
  - "**/*_pb2_grpc.py"
message: >-
  Mechanical half of the GitPython demotion for tests that own the private
  execute layer: call the private module function directly instead of the
  demoted facade receiver. The fix rewrites only the receiver; add the
  companion import `from flext_infra._utilities._git.repo import <name>`
  manually (ast-grep cannot insert it in the same pass).
rule:
  pattern: $RECV.$METHOD($$$ARGS)
constraints:
  RECV:
    regex: '^(?:u\.Infra|FlextInfraUtilitiesGit)$'
  METHOD:
    regex: '^git_(?:run|capture|capture_bytes)$'
fix: $METHOD($$$ARGS)
