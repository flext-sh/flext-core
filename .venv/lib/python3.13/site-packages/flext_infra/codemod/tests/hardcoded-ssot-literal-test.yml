id: hardcoded-ssot-literal
valid:
  # value read from the config SSOT -> canonical, must NOT match
    - |
      def build() -> str:
        return config.Infra.codegen.toolchain.python_version
  # value read from the constants SSOT -> canonical, must NOT match
  - |
    def build() -> str:
        return c.Infra.PYPROJECT_FILENAME
  # the constants module itself DECLARES the SSOT -> must NOT match
  # (declaration is the owner, not a duplicate)
  - |
    class FlextInfraConstantsMake:
        CHECK_GATES_VARIABLE: Final[str] = "CHECK_GATES"
  # a non-SSOT literal (log text) -> must NOT match
  - |
    def emit() -> None:
        logger.info("orchestration finished")
  # positional input of the function UNDER TEST -> legitimate data, must NOT match
  - |
    def test_release_tag() -> None:
        tm.that(mod.release_tag_from_branch("0.11.0-dev"), eq="v0.11.0")
  # parametrized invalid-format inputs -> test data, must NOT match
  - |
    @pytest.mark.parametrize("version", ["1.2", "a.b.c", "1.2.3-beta"])
    def test_parse(version: str) -> None:
        tm.fail(u.Infra.parse_semver(version))
invalid:
  # branch bound to a local field instead of read from ProviderSpec
  - |
    def build() -> object:
        return {"branch": "0.12.0-dev"}
  # clone URL bound to a contract field instead of read from the provider catalog
  - |
    def build() -> object:
        return m.Infra.RepositoryRef(url="https://github.com/flext-sh/flext-core.git")
  # same duplication expressed as a module-level assignment
  - |
    CANONICAL_URL = "https://github.com/flext-sh/flext-member.git"
