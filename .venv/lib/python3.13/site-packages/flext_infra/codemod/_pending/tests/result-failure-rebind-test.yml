id: result-failure-rebind
valid:
  - "return r[str].from_failure(result)"
  - "return r[str].fail(result.error or 'read failed')"
  - |
    if other.failure:
        return r[str].fail(result.error or "read failed")
  - |
    if result.failure:
        return r[str].fail(result.error or "read failed", error_code="READ")
invalid:
  - |
    if result.failure:
        return r[str].fail(result.error or "read failed")
  - |
    if loaded.failure:
        return r[p.Sample.Config].fail(loaded.error or c.Sample.ERR_CONFIG)
