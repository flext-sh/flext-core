id: recursive-type-alias
valid:
# Finite aliases with no container self-reference — must NOT match.
- "type Scalar = str | int | float | bool | None"
- "type LazyModule = ModuleType"
- "type YamlValue = t.JsonValue"
- "type TomlValue = t.JsonValue"
- "type EntrySequence = t.MutableSequenceOf[p.Ldif.Entry]"
- "type MakeTomlTable = t.JsonMapping"
invalid:
# Self-recursive container aliases — the Mypy memory-explosion class (flext-0ftd.3).
- "type YamlValue = YamlScalar | list[YamlValue] | Mapping[str, YamlValue]"
- "type TomlValue = Primitives | list[TomlValue] | dict[str, TomlValue]"
- "type ModuleGlobalValue = JsonValue | Callable[..., ModuleGlobalValue] | None"
- "type Nested = str | list[Nested]"
# Qualified class-scoped self-reference (the flext-tests TomlValue shape).
- "type TomlValue = Primitives | list[FlextTestsMakeTypesMixin.TomlValue] | dict[str, FlextTestsMakeTypesMixin.TomlValue]"
