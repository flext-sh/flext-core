# FLEXT 0.12 settings-namespace base drift — DETECTION ONLY (no fix:).
#
# `isinstance(settings.<Ns>, m.SettingsValue)` is a common stale assertion: the
# nested settings namespace (e.g. FlextTestsSettings.Tests) no longer inherits
# m.SettingsValue in 0.12 — in flext-tests it is a *raw* pydantic BaseModel, so
# the correct replacement is NEITHER m.SettingsValue NOR m.BaseModel
# (FlextModelsPydantic.BaseModel) but a pydantic-validity check
# (`hasattr(x, "model_dump")`) or the actual verified base.
#
# The right target VARIES per repo/namespace, so this rule is detection-only
# (safety protocol rung 2). A human/agent must confirm the real base with
# `python -c "print(type(settings.<Ns>).__flext__)"` before rewriting by hand.
id: settings-namespace-base-drift
language: python
severity: warning
message: >-
  isinstance(..., m.SettingsValue) may be stale in flext 0.12 — the settings
  namespace can now be a raw pydantic BaseModel. VERIFY the real FLEXT before
  rewriting; prefer `hasattr(x, "model_dump")` or the confirmed base. Detection
  only — do NOT auto-fix. See flext-codemod-astgrep SKILL.md safety protocol.
ignores:
  - "**/legado/**"
rule:
  pattern: isinstance($X, m.SettingsValue)
