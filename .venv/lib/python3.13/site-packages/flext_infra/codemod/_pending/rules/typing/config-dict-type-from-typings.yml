# FLEXT typing codemod: model_config ClassVar type MUST come from the typings
# facade (t.ConfigDict), never from protocols (p.ConfigDict — FlextProtocols has
# no ConfigDict) nor from models (m.ConfigDict — a model is never a type, §3.2).
#
#   model_config: ClassVar[p.ConfigDict] = m.ConfigDict(...)   # defect
#   model_config: ClassVar[m.ConfigDict] = m.ConfigDict(...)   # defect (m as type)
#                       ->
#   model_config: ClassVar[t.ConfigDict] = m.ConfigDict(...)   # canonical
#
# ConfigDict is exposed as a t.* TypeAlias in flext-core (FlextTypes.ConfigDict);
# p.* (protocols) does NOT carry it, so `p.ConfigDict` crashes at import
# (AttributeError: FlextProtocols has no attribute ConfigDict) and `m.ConfigDict`
# in an annotation violates the "model is never a type" law. The construction
# value (right-hand side) legitimately stays `m.ConfigDict(...)` and is preserved
# byte-for-byte via the $VAL metavariable.
#
# Generalist + idempotent: matches only $WRONG in {p, m}; an already-correct
# `t.ConfigDict` is not matched, so a re-scan finds zero matches. SettingsConfigDict
# and other members are intentionally out of scope (distinct rule if ever needed).
id: config-dict-type-from-typings
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/.claude/**"
  - "**/.git/**"
  - "**/.venv/**"
  - "**/legado/**"
  - "**/legacy/**"
  - "**/node_modules/**"
  - "**/*_pb2.py"
  - "**/*_pb2_grpc.py"
rule:
  pattern: "model_config: ClassVar[$WRONG.ConfigDict] = $VAL"
  # F821-safety guard: only rewrite to t.ConfigDict when the module already
  # imports `t` (module-level, so available to every class in the file). A
  # module with no `t` import is handled by the detection-only companion rule
  # config-dict-type-missing-t-import, which flags it before any rewrite.
  inside:
    stopBy: end
    kind: module
    has:
      stopBy: end
      kind: import_from_statement
      has:
        stopBy: end
        kind: identifier
        regex: "^t$"
constraints:
  WRONG:
    regex: "^[pm]$"
fix: "model_config: ClassVar[t.ConfigDict] = $VAL"
message: >-
  model_config type must be the typings alias t.ConfigDict, not p.ConfigDict
  (protocols has no ConfigDict -> import crash) nor m.ConfigDict (a model is
  never a type). Construction value m.ConfigDict(...) is kept.
