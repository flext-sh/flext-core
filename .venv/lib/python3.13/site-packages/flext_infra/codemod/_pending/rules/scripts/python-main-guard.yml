id: require-main-guard
language: python
rule:
  kind: module
  not:
    has:
      kind: if_statement
      has:
        pattern: __name__ == "__main__"
        stopBy: end
      stopBy: end
message: "Python scripts should have if __name__ == '__main__' guard"
severity: warning
---
id: prefer-sys-exit-main
language: python
rule:
  kind: if_statement
  has:
    pattern: __name__ == "__main__"
    stopBy: end
  not:
    has:
      any:
        - pattern: sys.exit(main())
        - pattern: sys.exit(main($$$))
        - pattern: main()
        - pattern: raise SystemExit(main())
      stopBy: end
message: "Main guard should call sys.exit(main()) for proper exit codes"
severity: hint
