id: requires-flext-core
language: python
rule:
  any:
  - kind: import_statement
    has:
      kind: dotted_name
      regex: "^flext_core"
      stopBy: end
  - kind: import_from_statement
    has:
      kind: dotted_name
      field: module_name
      regex: "^flext_core"
message: "flext_core import found (tracking)"
severity: warning
