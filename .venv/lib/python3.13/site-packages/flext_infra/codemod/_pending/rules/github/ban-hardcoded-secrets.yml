id: ban-hardcoded-secrets
language: yaml
rule:
  kind: block_mapping_pair
  all:
  - not:
      has:
        field: key
        regex: "(?i)^id-token$"
  - has:
      field: key
      regex: "(?i)(password|secret|token)"
  - has:
      field: value
      not:
        regex: "\\$\\{\\{"
message: "Hardcoded secret in workflow - use GitHub secrets"
severity: error
