id: require-env-bash-shebang
language: bash
rule:
  kind: program
  not:
    has:
      kind: comment
      regex: "^#!/usr/bin/env bash"
      stopBy: end
message: "Bash scripts must use #!/usr/bin/env bash shebang"
severity: warning
---
id: require-set-euo-pipefail
language: bash
rule:
  kind: program
  not:
    has:
      kind: command
      pattern: set -euo pipefail
      stopBy: end
message: "Bash scripts must include 'set -euo pipefail'"
severity: warning
