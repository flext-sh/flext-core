id: no-direct-singer-import-meltano
language: python
rule:
  any:
  - kind: import_statement
    has:
      kind: dotted_name
      regex: "^meltano"
      stopBy: end
  - kind: import_from_statement
    has:
      kind: dotted_name
      field: module_name
      regex: "^meltano"
message: "Direct meltano import - use flext_meltano adapter"
severity: error
