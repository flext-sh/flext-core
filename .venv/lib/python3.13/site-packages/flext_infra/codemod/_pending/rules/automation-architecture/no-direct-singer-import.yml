id: no-direct-singer-import
language: python
rule:
  any:
  - kind: import_statement
    has:
      kind: dotted_name
      regex: "^singer"
      stopBy: end
  - kind: import_from_statement
    has:
      kind: dotted_name
      field: module_name
      regex: "^singer"
message: "Direct singer import - use flext_meltano adapter"
severity: error
