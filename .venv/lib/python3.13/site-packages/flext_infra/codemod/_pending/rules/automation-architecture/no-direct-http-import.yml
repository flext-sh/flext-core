id: no-direct-http-import
language: python
rule:
  any:
  - kind: import_statement
    has:
      kind: dotted_name
      regex: "^(requests|httpx|urllib)$"
      stopBy: end
  - kind: import_from_statement
    has:
      kind: dotted_name
      field: module_name
      regex: "^(requests|httpx|urllib)"
message: "Direct HTTP library import - use flext_core adapter"
severity: error
