id: fix-pydantic-v1-dict
language: python
rule:
  pattern: $MODEL.dict($$$ARGS)
fix: $MODEL.model_dump($$$ARGS)
message: "Rewrite .dict() -> .model_dump()"
severity: error
---
id: fix-pydantic-v1-parse-obj
language: python
rule:
  pattern: $MODEL.parse_obj($ARG)
fix: $MODEL($ARG)
message: "Rewrite .parse_obj() -> ()"
severity: error
---
id: fix-pydantic-v1-parse-raw
language: python
rule:
  pattern: $MODEL.parse_raw($ARG)
fix: $MODEL.model_validate_json($ARG)
message: "Rewrite .parse_raw() -> .model_validate_json()"
severity: error
---
id: fix-pydantic-v1-json
language: python
rule:
  pattern: $MODEL.json($$$ARGS)
fix: $MODEL.model_dump_json($$$ARGS)
message: "Rewrite .json() -> .model_dump_json()"
severity: error
---
id: fix-pydantic-v1-validator-import
language: python
rule:
  pattern: from pydantic import validator
fix: from pydantic import u.field_validator
message: "Rewrite validator import -> u.field_validator import"
severity: error
---
id: fix-pydantic-v1-root-validator-import
language: python
rule:
  pattern: from pydantic import root_validator
fix: from pydantic import u.model_validator
message: "Rewrite root_validator import -> u.model_validator import"
severity: error
