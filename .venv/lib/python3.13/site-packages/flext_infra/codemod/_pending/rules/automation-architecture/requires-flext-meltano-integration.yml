id: requires-flext-meltano-integration
language: python
rule:
  any:
  - kind: import_statement
    has:
      kind: dotted_name
      regex: "^singer_sdk"
      stopBy: end
  - kind: import_from_statement
    has:
      kind: dotted_name
      field: module_name
      regex: "^singer_sdk"
message: "singer_sdk import found (tracking)"
severity: warning
