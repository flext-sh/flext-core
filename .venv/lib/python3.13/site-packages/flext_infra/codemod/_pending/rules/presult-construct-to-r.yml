id: presult-construction-without-r-import
language: python
severity: hint
message: >-
  p.Result is an annotation protocol, not a constructor. Import the canonical r
  facade in semantic c/t/p/m/u/r order before applying the receiver rewrite.
ignores:
  - "**/legado/**"
rule:
  any:
    - pattern: p.Result[$T].ok($$$A)
    - pattern: p.Result[$T].fail($$$A)
  not:
    inside:
      kind: module
      stopBy: end
      has:
        kind: import_from_statement
        stopBy: end
        has:
          kind: identifier
          regex: "^r$"
          stopBy: end
