id: require-flext-result-pattern
language: python
rule:
  any:
  - kind: import_from_statement
    has:
      kind: identifier
      regex: "^r$"
      stopBy: end
  - kind: function_definition
    has:
      field: return_type
      regex: "r"
      stopBy: end
message: "r pattern found (tracking)"
severity: warning
