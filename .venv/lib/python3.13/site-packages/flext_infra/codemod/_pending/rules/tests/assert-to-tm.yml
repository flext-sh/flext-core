  - "tests/**/*.py"
ignores:
  - "**/legado/**"
  - "**/legacy/**"
rule:
  kind: assert_statement
  all:
    - pattern: "assert $R.failure"
    - not: { matches: assert-has-message }
    - inside:
        kind: module
        stopBy: end
        has: { matches: tm-imported-from-flext, stopBy: end }
fix: "tm.fail($R)"
message: "assert r.failure -> tm.fail(r) (returns the failure detail)."

---
# Truthy fallback: any remaining `assert <expr>` becomes tm.that(expr, eq=True).
# LAST in the family; excludes every shape owned by a specific matcher above
# (comparison_operator covers ==/!=/is/is not/in/not in; not_operator; isinstance;
# .success/.failure) so it never produces a false or lossy rewrite.
id: assert-truthy-to-tm
language: python
severity: hint
files:
  - "**/tests/**/*.py"
  - "tests/**/*.py"
ignores:
  - "**/legado/**"
  - "**/legacy/**"
rule:
  kind: assert_statement
  all:
    - pattern: "assert $EXPR"
    - not: { has: { kind: comparison_operator } }
    - not: { has: { kind: not_operator } }
    - not: { pattern: "assert isinstance($X, $T)" }
    - not: { pattern: "assert $R.success" }
    - not: { pattern: "assert $R.failure" }
    - not: { matches: assert-has-message }
    - inside:
        kind: module
        stopBy: end
        has: { matches: tm-imported-from-flext, stopBy: end }
fix: "tm.that($EXPR, eq=True)"
message: "assert expr -> tm.that(expr, eq=True) (truthy fallback)."

