---
# Result-outcome asserts: the tm matcher returns the unwrapped value, so prefer
# tm.ok / tm.fail over a truthy check. These run conceptually before the truthy
# fallback, which explicitly excludes .success / .failure to avoid a double fix.
id: assert-result-success-to-tm
language: python
severity: hint
files:
  - "**/tests/**/*.py"
  - "tests/**/*.py"
ignores:
  - "**/legado/**"
  - "**/legacy/**"
rule:
  kind: assert_statement
  all:
    - pattern: "assert $R.success"
    - not: { matches: assert-has-message }
    - inside:
        kind: module
        stopBy: end
        has: { matches: tm-imported-from-flext, stopBy: end }
fix: "tm.ok($R)"
message: "assert r.success -> tm.ok(r) (returns the unwrapped value)."

---
