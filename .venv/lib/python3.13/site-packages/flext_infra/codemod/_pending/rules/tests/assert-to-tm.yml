# FLEXT test-assertion codemod: `assert` is never allowed in FLEXT tests; the
# canonical matcher family is `tm` (flext-tests). This ONE file consolidates the
# whole assert->tm family (previously ~10 shape-partial rules) into a
# matcher-COMPLETE set that covers every assertion aspect from the verified
# SKILL.md matcher map, sharing the guards through the global utils
# (tm-imported-from-flext, assert-has-message) so there is no duplicated block.
#
# Every rule below:
#   * fires only in test files (files: tests/**), skips legado/;
#   * skips messaged asserts (not: matches: assert-has-message) — intent preserved;
#   * rewrites only when `tm` is imported from a flext facade
#     (inside: has: matches: tm-imported-from-flext) so it can never emit an
#     undefined name (Ruff F821). Modules without the tm import are reported by
#     the detection-only companion assert-to-tm-missing-import.
#
# Matcher map (assert form -> tm form), each an ordered rule so the most specific
# shape wins before the truthy fallback:
#   assert a == b        -> tm.that(a, eq=b)
#   assert a != b        -> tm.that(a, ne=b)
#   assert x is None     -> tm.that(x, none=True)
#   assert x is not None -> tm.that(x, none=False)
#   assert isinstance x  -> tm.that(x, is_=T)
#   assert x in y        -> tm.that(y, has=x)
#   assert x not in y    -> tm.that(y, lacks=x)
#   assert not expr      -> tm.that(expr, eq=False)   [comparison shapes excluded]
#   assert expr          -> tm.that(expr, eq=True)    [truthy fallback, see assert-truthy-to-tm.yml]
id: assert-eq-to-tm
language: python
severity: hint
files:
  - "**/tests/**/*.py"
  - "tests/**/*.py"
ignores:
  - "**/legado/**"
  - "**/legacy/**"
rule:
  kind: assert_statement
  all:
    - pattern: "assert $A == $B"
    - not: { matches: assert-has-message }
    - inside:
        kind: module
        stopBy: end
        has: { matches: tm-imported-from-flext, stopBy: end }
fix: "tm.that($A, eq=$B)"
message: "assert a == b -> tm.that(a, eq=b) (FLEXT tests use tm, never assert)."

