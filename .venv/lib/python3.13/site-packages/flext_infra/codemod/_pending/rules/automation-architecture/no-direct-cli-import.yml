id: no-direct-cli-import
language: python
rule:
  any:
  - kind: import_statement
    has:
      kind: dotted_name
      regex: "^(click|rich|typer)$"
      stopBy: end
  - kind: import_from_statement
    has:
      kind: dotted_name
      field: module_name
      regex: "^(click|rich|typer)"
message: "Direct CLI library import - use flext_cli adapter"
severity: error
