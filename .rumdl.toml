[global]
exclude = ["AGENTS.md", "CLAUDE.md", "GEMINI.md", ".kilo/**", ".omo/**", ".zcode/**", ".tmp/**", ".claude/**", ".vscode/**", ".serena/**", ".snapshots/**", ".benchmarks/**", ".hypothesis/**", "CHANGELOG.md", "docs/docs_config.json", "docs/architecture/architecture_config.json", ".mypy_cache/**", ".pytest_cache/**", ".ruff_cache/**", ".venv/**", "__pycache__/**", "node_modules/**", ".reports/**", "dist/**", "build/**", "htmlcov/**", "legado/**", ".github/**", "site/**", "target/**", ".agents/**", ".gemini/**", ".beads/**", "docs/knowledge-index.md", "docs/architecture/communities/index.md", "docs/architecture/crg-reports/**", "docs/api-reference/generated/**", "docs/plans/2026-09-14-stabilization-handoff/previous-handoff-source.md", "docs/plans/2026-09-22-pipeline-integracao-continua-plano.md", "docs/plans/2026-09-22-rope-generator-stabilization/02-achados-codegen.md", "docs/plans/2026-09-23-handoff-mypy-stabilization-e-integracao.md", "docs/plans/2026-09-25-v8-flext-service-base/05-phases.md", "docs/plans/2026-09-25-v8-flext-service-base/07-sessions-guide.md", "docs/standards/consumption-law.md", "docs/projects/generated/**"]
