Infra:
  codegen:
    repository:
      examples_module: examples.ex_12_flext_registry
      namespace_scan_dirs:
      - src
    toolchain:
      # The promoted integration line owns dependency resolution; make upg
      # records its exact commits for frozen replay.
      uv_override_dependencies:
        - "flext-cli @ git+https://github.com/flext-sh/flext-cli.git@0.12.0-dev"
        - "flext-infra @ git+https://github.com/flext-sh/flext-infra.git@0.12.0-dev"
        - "flext-tests @ git+https://github.com/flext-sh/flext-tests.git@0.12.0-dev"
