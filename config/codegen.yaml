Infra:
  codegen:
    repository:
      examples_module: examples.ex_12_flext_registry
      namespace_scan_dirs:
      - src
    toolchain:
      # flext-infra and flext-tests overrides derive from this project's own
      # Git URL requirements. flext-cli is not a declared requirement: it
      # enters only transitively (through flext-infra) and requires flext-core
      # back by URL, so its override, and the derived scoped self exclusion,
      # is this project's one non-derivable delta.
      uv_override_dependencies:
        - "flext-cli @ git+https://github.com/flext-sh/flext-cli.git@0.12.0-dev"
