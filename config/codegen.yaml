Infra:
  codegen:
    vscode:
      additional_settings:
        python-envs.workspaceSearchPaths:
        - ./.venv
        - ./*/.venv
        terminal.integrated.env.linux:
          PATH: ${workspaceFolder}/.venv/bin:${env:PATH}
          VIRTUAL_ENV: ${workspaceFolder}/.venv
        ruff.interpreter:
        - ${workspaceFolder}/.venv/bin/python
        ruff.path:
        - ${workspaceFolder}/.venv/bin/ruff
    repository:
      namespace_scan_dirs:
      - src
    toolchain:
      # Why (tracker memory operator-ruling-2026-10-16-integration-branch-upload,
      # flext store): the family integrates on upload-20261007 and 0.12.0-dev
      # receives it only when green, so every member resolves on one ref; make
      # upg records the commits.
      uv_override_dependencies:
        - "flext-cli @ git+https://github.com/flext-sh/flext-cli.git@upload-20261007"
        - "flext-infra @ git+https://github.com/flext-sh/flext-infra.git@upload-20261007"
        - "flext-tests @ git+https://github.com/flext-sh/flext-tests.git@upload-20261007"
