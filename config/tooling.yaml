ManagedArtifacts:
  Ruff:
    per_file_ignores:
      src/flext_core/_typings/base.py:
        [non-pep695-type-alias, quoted-type-alias]
tools:
  mypy:
    # Whole-program cold mypy on the foundation package exceeds the fleet
    # default on the CI runner (proven: tip pure and cure branch both need
    # >100s cold; warm runs fit). The runner budget follows this SSOT.
    timeout_seconds: 300
