Infra:
  codegen:
    toolchain:
      # Consumer pins (config-as-data): `latest` re-resolves upstream and
      # drifts from mise.lock between upg runs — `mise install --locked` then
      # fails on CI. These are exactly the versions mise.lock resolves.
      qlty_version: "0.645.0"
      jscpd_version: "5.3.2"
      prettier_version: "3.9.9"
