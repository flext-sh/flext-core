# Generated by `flext-infra codegen conform` for flext-core — DO NOT EDIT.
#
# Release protocol projection. The workflow selects which protocol phase to
# run; every decision (next version, guard, tag identity, receipt, upload set)
# is made by the repository's elected `make release-<phase>` commands, never here.
#
# - A push to the integration branch whose head is NOT the protocol's release
#   commit opens or updates the release pull request (`make release-version
#   `); when nothing is releasable the run is a no-op.
# - Release commits are validated but never publish unattended.
# - `workflow_dispatch` selects exactly one existing tag for publication or
#   retained checkpoint for versioning. Checkpoint dispatch never publishes.
name: Release

"on":
  push:
    branches:
      - 0.12.0-dev
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and publish again (example: v0.12.0)"
        required: false
        type: string
      checkpoint_ref:
        description: "Existing retained, published and integrated checkpoint for versioning only"
        required: false
        type: string

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions: {}

jobs:
  identity:
    name: Resolve release state
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release_commit: ${{ steps.head.outputs.release_commit }}
      ref: ${{ steps.head.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.sha }}
      - name: Classify HEAD
        id: head
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ inputs.tag }}
          LANE_CHECKPOINT_REF: ${{ inputs.checkpoint_ref }}
        shell: bash
        run: |
          set -euo pipefail
          subject="$(git log -1 --format=%s)"
          echo "ref=$(git rev-parse HEAD^{commit})" >> "${GITHUB_OUTPUT}"
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ -n "${RELEASE_TAG}" ] && [ -z "${LANE_CHECKPOINT_REF}" ]; then
              git check-ref-format "refs/tags/${RELEASE_TAG}"
              echo "release_commit=true" >> "${GITHUB_OUTPUT}"
            elif [ -z "${RELEASE_TAG}" ] && [ -n "${LANE_CHECKPOINT_REF}" ]; then
              git check-ref-format "${LANE_CHECKPOINT_REF}"
              echo "release_commit=false" >> "${GITHUB_OUTPUT}"
            else
              printf '%s\n' 'dispatch requires exactly one tag or checkpoint_ref' >&2
              exit 2
            fi
          else
            case "${subject}" in
              "chore(release): v"*) echo "release_commit=true" >> "${GITHUB_OUTPUT}" ;;
              *) echo "release_commit=false" >> "${GITHUB_OUTPUT}" ;;
            esac
          fi

  candidate-ci:
    name: Validate exact release candidate
    needs: identity
    permissions:
      contents: read

    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.identity.outputs.ref }}
    secrets: inherit

  version:
    name: Open or update the release pull request
    needs: [identity, candidate-ci]
    if: needs.identity.outputs.release_commit == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      ref: ${{ steps.version.outputs.ref }}
    permissions:
      contents: write  # Push the release/next lane.
      pull-requests: write  # Open or update the release pull request.
    env:
      CI: Y
      # GitHub standard: the built-in GITHUB_TOKEN with the declared job
      # permissions (contents: write, pull-requests: write) opens and updates
      # the release pull request. version-ci validates its resulting HEAD
      # directly: this token does not trigger pull-request or push workflows.
      GH_TOKEN: ${{ github.token }}
      LANE_CHECKPOINT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.checkpoint_ref || vars.LANE_CHECKPOINT_REF }}
    defaults:
      run:
        working-directory: flext-core
    steps:
      - name: Checkout workspace flext-sh/flext
        uses: actions/checkout@v7
        with:
          repository: flext-sh/flext
          ref: 0.12.0-dev
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0
      - name: Pin flext-core at the tested commit
        working-directory: .
        run: |
          set -eu
          git -C "flext-core" fetch --no-tags origin "${{ needs.identity.outputs.ref }}"
          git -C "flext-core" checkout --detach FETCH_HEAD
      - name: Authorize release pushes to flext-core
        working-directory: .
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          header="$(printf 'x-access-token:%s' "${PUSH_TOKEN}" | base64 -w0)"
          printf '::add-mask::%s\n' "${header}"
          git -C "flext-core" config --local \
            "http.https://github.com/${GITHUB_REPOSITORY}/.extraheader" \
            "AUTHORIZATION: basic ${header}"
      - name: Release identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Boot
        run: make setup
      - name: Admit validated integration commit
        env:
          INTEGRATION_BRANCH: 0.12.0-dev
        run: git switch -C "${INTEGRATION_BRANCH}" HEAD
      - name: Release pull request
        id: version
        run: |
          set -euo pipefail
          make release-version
          echo "ref=$(git rev-parse HEAD^{commit})" >> "${GITHUB_OUTPUT}"

  version-ci:
    name: Validate release pull request commit
    needs: version
    permissions:
      contents: read

    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.version.outputs.ref }}
    secrets: inherit

  publish:
    name: Tag, build and publish the release commit
    needs: [identity, candidate-ci]
    if: github.event_name == 'workflow_dispatch' && needs.identity.outputs.release_commit == 'true' && needs.candidate-ci.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write # Push the release tag and create the GitHub release.

    env:
      CI: Y
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: flext-core
    steps:
      - name: Checkout workspace flext-sh/flext
        uses: actions/checkout@v7
        with:
          repository: flext-sh/flext
          ref: 0.12.0-dev
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0
      - name: Pin flext-core at the tested commit
        working-directory: .
        run: |
          set -eu
          git -C "flext-core" fetch --no-tags origin "${{ needs.identity.outputs.ref }}"
          git -C "flext-core" checkout --detach FETCH_HEAD
      - name: Authorize release pushes to flext-core
        working-directory: .
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          header="$(printf 'x-access-token:%s' "${PUSH_TOKEN}" | base64 -w0)"
          printf '::add-mask::%s\n' "${header}"
          git -C "flext-core" config --local \
            "http.https://github.com/${GITHUB_REPOSITORY}/.extraheader" \
            "AUTHORIZATION: basic ${header}"
      - name: Release identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Boot
        run: make setup
      - name: Tag
        run: make release-tag
      - name: Build receipt
        run: make release-build
      - name: Publish
        run: make release-publish
