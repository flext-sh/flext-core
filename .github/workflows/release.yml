# Generated by `flext-infra codegen conform` for flext-core — DO NOT EDIT.
#
# Release protocol projection. The workflow selects which protocol phase to
# run; every decision (next version, guard, tag identity, receipt, upload set)
# is made by the direct `make release-*` and `make publication` verbs, never here.
#
# - A push to the integration branch whose head is NOT the protocol's release
#   commit opens or updates the release pull request (`make release-version
#   APPLY=Y`); when nothing is releasable the run is a no-op.
# - A push whose head IS the release commit (the merged release pull request)
#   tags it, builds the receipt and publishes exactly what the receipt attests.
# - `workflow_dispatch` re-runs build and publication for an existing tag.
name: Release

"on":
  push:
    branches:
      - 0.12.0-dev
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and publish again (example: v0.12.0)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions: {}

jobs:
  identity:
    name: Resolve release state
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release_commit: ${{ steps.head.outputs.release_commit }}
      ref: ${{ steps.head.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}
      - name: Classify HEAD
        id: head
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          subject="$(git log -1 --format=%s)"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "ref=refs/tags/$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
            echo "release_commit=true" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            case "$subject" in
              "chore(release): v"*) echo "release_commit=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "release_commit=false" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

  version:
    name: Open or update the release pull request
    needs: identity
    if: needs.identity.outputs.release_commit == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # Push the release/next lane.
      pull-requests: write # Open or update the release pull request.
    env:
      CI: Y
      # A pull request opened with the default GITHUB_TOKEN triggers no CI, so
      # the release PR would reach merge unvalidated (flext-1wjg1.16.5). The
      # lane push and the PR use the organization automation token; when that
      # secret is absent the job fails loud instead of degrading silently.
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    steps:
      - name: Require the release automation token
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::secrets.RELEASE_TOKEN is not configured: a release pull request opened with GITHUB_TOKEN triggers no CI. Configure the organization secret and rerun." >&2
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.RELEASE_TOKEN }}

      # A private git dependency cannot be cloned with the workflow's own
      # token: secrets.GITHUB_TOKEN is scoped to the repository that runs the
      # workflow, and uv drives dependency clones through plain git, which
      # carries no credential at all. The declared App mints an installation
      # token for the owner, and git reads it from a 0600 file outside the
      # checkout — never from the environment of the build itself.
      - name: Mint the private-dependency installation token
        id: private_dependency_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.CI_DEPENDENCIES_APP_ID }}
          private-key: ${{ secrets.CI_DEPENDENCIES_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Authenticate git for private dependencies
        env:
          PRIVATE_DEPENDENCY_TOKEN: ${{ steps.private_dependency_token.outputs.token }}
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required for private dependency identity}"
          if [ -z "${PRIVATE_DEPENDENCY_TOKEN}" ]; then
            echo "::error::the CI_DEPENDENCIES_APP_ID App produced no installation token — a private git dependency cannot be resolved"
            exit 1
          fi
          store="$RUNNER_TEMP/flext-private-dependency-credentials"
          install -m 600 /dev/null "$store"
          printf 'https://x-access-token:%s@github.com\n' "$PRIVATE_DEPENDENCY_TOKEN" > "$store"
          git config --global credential.helper "store --file=$store"
      - name: Release identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Boot
        run: make setup
      - name: Release pull request
        run: make release-version APPLY=Y

  publish:
    name: Tag, build and publish the release commit
    needs: identity
    if: needs.identity.outputs.release_commit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write # Push the release tag and create the GitHub release.
    env:
      CI: Y
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.identity.outputs.ref }}
          submodules: false

      # A private git dependency cannot be cloned with the workflow's own
      # token: secrets.GITHUB_TOKEN is scoped to the repository that runs the
      # workflow, and uv drives dependency clones through plain git, which
      # carries no credential at all. The declared App mints an installation
      # token for the owner, and git reads it from a 0600 file outside the
      # checkout — never from the environment of the build itself.
      - name: Mint the private-dependency installation token
        id: private_dependency_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.CI_DEPENDENCIES_APP_ID }}
          private-key: ${{ secrets.CI_DEPENDENCIES_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Authenticate git for private dependencies
        env:
          PRIVATE_DEPENDENCY_TOKEN: ${{ steps.private_dependency_token.outputs.token }}
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required for private dependency identity}"
          if [ -z "${PRIVATE_DEPENDENCY_TOKEN}" ]; then
            echo "::error::the CI_DEPENDENCIES_APP_ID App produced no installation token — a private git dependency cannot be resolved"
            exit 1
          fi
          store="$RUNNER_TEMP/flext-private-dependency-credentials"
          install -m 600 /dev/null "$store"
          printf 'https://x-access-token:%s@github.com\n' "$PRIVATE_DEPENDENCY_TOKEN" > "$store"
          git config --global credential.helper "store --file=$store"
      - name: Release identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Boot
        run: make setup
      - name: Tag
        run: make release-tag APPLY=Y
      - name: Build receipt
        run: make release-build APPLY=Y
      - name: Publish
        run: make publication APPLY=Y
