          fetch-depth: 0
          ref: ${{ needs.identity.outputs.ref }}
          submodules: false
          token: ${{ github.token }}
      - name: Release identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Install the mise release pinned by mise.lock
        shell: bash
        run: |
          set -eu
          mise_system="${RUNNER_OS}"
          if [ "${mise_system}" = "macOS" ]; then mise_system=Darwin; fi
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Windows-X64) mise_machine=AMD64 ;;
            Linux-ARM64) mise_machine=aarch64 ;;
            *-X64) mise_machine=x86_64 ;;
            *-ARM64) mise_machine=arm64 ;;
            *) echo "ERROR: unsupported runner identity ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 2 ;;
          esac
          case "${mise_system}/${mise_machine}" in
            Linux/x86_64) mise_platform=linux-x64 ;;
            Linux/aarch64) mise_platform=linux-arm64 ;;
            Darwin/x86_64) mise_platform=macos-x64 ;;
            Darwin/arm64) mise_platform=macos-arm64 ;;
            Windows/AMD64) mise_platform=windows-x64 ;;
            *) echo "ERROR: no mise.lock platform for ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 2 ;;
          esac
          mise_field() {
            awk -v section="[tools.\"github:jdx/mise\".\"platforms.${mise_platform}\"]" -v key="$1" '
              $0 == section { inside = 1; next }
              inside && substr($0, 1, 1) == "[" { exit }
              inside && $1 == key { gsub(/"/, "", $3); print $3; exit }
            ' mise.lock
          }
          mise_url="$(mise_field url)"
          mise_checksum="$(mise_field checksum)"
