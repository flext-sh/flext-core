name: CI

# === SECTION: triggers (managed) ===
# Source: CI policy — integration push/PR = blocking CI only;
# main push/PR (non-draft) = blocking CI; draft and other branches = none;
# workflow_call changes no direct-run behavior and declares the optional
# cross-repo dependency-credential secret contract in workflow scope.
"on":
  workflow_dispatch:
  push:
    branches:
      - main
      - 0.12.0-dev
      - 0.20.0-dev
  pull_request:
    branches:
      - main
      - 0.12.0-dev
      - 0.20.0-dev
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_call:
    secrets:
      CI_DEPENDENCIES_APP_ID:
        required: false
        description: >-
          Optional cross-repo dependency GitHub App id; when absent the
          cross-repo credential step records NOT EXECUTED and public sibling
          dependencies resolve anonymously.
      CI_DEPENDENCIES_APP_PRIVATE_KEY:
        required: false
        description: >-
          Optional GitHub App private key minting the short-lived installation
          token for cross-repo private git dependencies.
# End SECTION: triggers

# Why: one active run per workflow and branch prevents obsolete CI from consuming runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # === SECTION: ci job (managed) ===
  # Source: template + config:github_actions.*
  ci:
    name: ci
    # Only the checkout job needs repository contents; packages: read is
    # granted solely to distributions declared in codegen
    # ci_package_registry_read, whose gates resolve GitHub Packages.
    permissions:
      contents: read
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: Y
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
          fetch-depth: 0
      # Why: GitHub runners expose umask 002, so git checkout materializes
      # group-writable modes (0664) for tracked files. Canonical Mise
      # artifacts demand exact modes (0o644) and the conform gate fails loud
      # on any drift, so checkout content is normalized to canonical modes
      # once, before any gate runs.
      - name: Normalize checkout modes
        run: chmod -R go-w .

      # Why: every fresh runner paid a cold full-dependency Mypy,
      # Pyrefly and Ruff analysis. The caches below are content-addressed by the
      # committed dependency locks, so a warm cache is always valid for the same
      # lock and can never hide a finding; it only removes the cold recompute.
      # Why: the same pair keeps the locked Mise tool storage, so
      # a cold runner never re-downloads the pinned tarballs, where a network
      # blip failed setup.
      - name: Restore tool caches
        id: tool-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            __pycache__
            .mypy_cache
            .pytest_cache
            .ruff_cache
            .pyrefly_cache
            .benchmarks
            .hypothesis
            ~/.cache/uv
            ~/.local/share/mise
          key: ${{ runner.os }}-3.13-tools-${{ hashFiles('uv.lock', 'mise.lock', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-3.13-tools-

      # make setup is the frozen installer. It bootstraps the committed Mise
      # release and installs the fleet toolchain from the committed
      # mise.lock and the dependencies frozen from the committed uv.lock,
      # publishes that environment through GITHUB_PATH, and prepares the
      # project runtime. CI never runs `make upg`: it never re-resolves.
      # Why: make test always selects through the persistent testmon database
      # (make.testmon_cache), which lives outside the checkout under the
      # declared project name. A runner without it starts from an empty history
      # and selects the whole suite. Restore the newest database of any earlier
      # run: testmon revalidates every recorded file by checksum, so a restored
      # database never hides a changed dependency of a selected test.
      - name: Resolve project testmon database
        id: testmon_path
        run: |
          set -eu
          cache_home="${XDG_CACHE_HOME:-${HOME}/.cache}"
          database="$(realpath -m "$cache_home/flext/infra/testmon/flext-core/.testmondata")"
          case "$database" in /*) ;; *) exit 2 ;; esac
          printf 'database=%s\n' "$database" >> "$GITHUB_OUTPUT"
      - name: Restore testmon database
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.testmon_path.outputs.database }}
          key: ${{ runner.os }}-3.13-flext-testmon-flext-core-${{ hashFiles('uv.lock', 'mise.lock', 'pyproject.toml', 'config/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-3.13-flext-testmon-flext-core-${{ hashFiles('uv.lock', 'mise.lock', 'pyproject.toml', 'config/**') }}-


      - name: Approval (blocking)
        id: approval
        # One owner for setup -> audit -> check -> test in both profiles.
        run: CI=Y make pre-commit

      - name: Dump reports on failure
        if: ${{ failure() }}
        run: |
          set -eu
          # Structured reports only — same allowlist as Upload reports (no raw
          # pytest/tool logs: those may carry connection strings / env secrets).
          for report_root in .reports apps; do
            if [ -d "$report_root" ]; then
              find "$report_root" \
                \( -path '*/junit.xml' -o -path '*/coverage.xml' -o -path '*/coverage.json' \) \
                -type f -exec sh -eu -c '
                  for report_file do
                    printf "::group::%s\n" "$report_file"
                    tail -n 200 "$report_file"
                    printf "::endgroup::\n"
                  done
                ' sh {} +
            fi
          done
      - name: Upload reports on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: flext-ci-reports-${{ github.run_id }}
          # Structured reports only — omit raw pytest/tool logs that may carry
          # connection strings or env-derived secrets from integration fixtures.
          path: |
            .reports/**/junit.xml
            .reports/**/coverage.xml
            .reports/**/coverage.json
            .reports/check/**/*.sarif
            .reports/check/**/*.md
            .reports/tests/**/run-accounting.json
            .reports/tests/**/cache-after.json
          if-no-files-found: ignore
          retention-days: 7
      # Completed failing tests may save; cancelled/incomplete/corrupt runs cannot.
      - name: Save testmon database
        if: >-
          ${{ always() && !cancelled() && github.event_name == 'push' && steps.approval.outputs.testmon_saveable == 'true' && steps.approval.outputs.testmon_database == steps.testmon_path.outputs.database && steps.approval.outputs.testmon_digest != '' && contains(fromJSON('["main", "0.12.0-dev", "develop"]'), github.ref_name) && startsWith(github.ref, 'refs/heads/') }}
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.approval.outputs.testmon_database }}
          key: ${{ runner.os }}-3.13-flext-testmon-flext-core-${{ hashFiles('uv.lock', 'mise.lock', 'pyproject.toml', 'config/**') }}-${{ github.run_id }}-${{ github.run_attempt }}


      # Why: save on every outcome — including a failing gate — so
      # the next run starts warm. Only written when the restore missed.
      - name: Save tool caches
        if: ${{ always() && steps.tool-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            __pycache__
            .mypy_cache
            .pytest_cache
            .ruff_cache
            .pyrefly_cache
            .benchmarks
            .hypothesis
            ~/.cache/uv
            ~/.local/share/mise
          key: ${{ runner.os }}-3.13-tools-${{ hashFiles('uv.lock', 'mise.lock', 'pyproject.toml') }}

  # End SECTION: ci job

  # === SECTION: release-plan job (managed) ===
  # The release protocol's read-only decision on every pull request: the title
  # must be a Conventional Commits title (it becomes the merge commit subject
  # the next release is derived from), and no pyproject version may change
  # outside the protocol's own release commit.
  release-plan:
    name: release-plan
    permissions:
      contents: read
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: Y
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Boot
        run: CI=Y make setup
      - name: Release plan and guard
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: make release-plan
  # End SECTION: release-plan job

  # === SECTION: merge-guard job (managed) ===
  merge-guard:
    name: merge-guard
    permissions:
      contents: read
    # Draft is the typed WIP state: no repository Action is selected until the
    # same PR is promoted to Review with a non-WIP head.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout promoted head
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # Inspect the PR head commit, not the refs/pull/N/merge commit that
          # actions/checkout selects by default on pull_request events; the
          # merge commit subject would never carry the WIP marker.
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Block WIP heads from protected integration branches
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -eu
          case "$BASE_REF" in
            dev|develop|0.12.0-dev)
              ;;
            *)
              echo "Merge guard passed for $(git rev-parse HEAD) -> $BASE_REF"
              exit 0
              ;;
          esac
          subject=$(git log -1 --format=%s)
          if printf '%s' "$subject" | grep -qiE '^\[WIP\]|^WIP|^wip'; then
            echo "WIP head cannot merge into ${BASE_REF}: ${subject}"
            exit 1
          fi
          echo "Merge guard passed for $(git rev-parse HEAD) -> $BASE_REF"
  # End SECTION: merge-guard job
