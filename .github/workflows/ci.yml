name: CI

# === SECTION: triggers (managed) ===
# Source: operator CI policy — integration push/PR = blocking CI only;
# main push/PR (non-draft) = blocking CI; draft and other branches = none.
"on":
  push:
    branches:
      - dev
      - develop
      - 0.12.0-dev
      - main
  pull_request:
    branches:
      - dev
      - develop
      - 0.12.0-dev
      - main
    types: [opened, synchronize, reopened, ready_for_review]
# End SECTION: triggers

# Why: one active run per workflow and branch prevents obsolete CI from consuming runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # === SECTION: ci job (managed) ===
  # Source: template + config:github_actions.*
  ci:
    name: ci
    # Only the checkout job needs repository contents.
    permissions:
      contents: read
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: Y
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          fetch-depth: 0

      - name: Install mise toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14  # v4.2.3
        with:
          version: 2026.9.0

      # Why: the official uv cache must never be reused across differently
      # resolved projects — cache identity is owned ONLY by uv.lock. The uv
      # version comes from the same toolchain SSOT that renders .mise.toml,
      # keeping one version source for local (mise) and CI (setup-uv).
      - name: Set up uv with lock-owned cache
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: 0.12
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: locked

      # The direnv check gate runs a real `direnv exec` activation smoke. The
      # preinstalled runner image has no direnv binary, so provision it here —
      # the gate is intentional and its binary must exist wherever CI=Y make
      # check runs. The smoke runs unattended, where no one can answer
      # `direnv allow`, so allow the checkout's .envrc up front: `direnv allow
      # <path>` computes and stores the same path-hash record an interactive
      # allow writes. .envrc is tracked, so it exists right after checkout.
      # This trusts only this repo's own generated file, on this runner only.
      - name: Install direnv (check-gate dependency)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq direnv
          direnv allow "${{ github.workspace }}/.envrc"
      - name: Restore testmon cache
        id: testmon-restore
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            .testmondata
          key: testmon-v1-${{ runner.os }}-${{ runner.arch }}-py3.13-${{ hashFiles('uv.lock', '**/uv.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            testmon-v1-${{ runner.os }}-${{ runner.arch }}-py3.13-${{ hashFiles('uv.lock', '**/uv.lock') }}-
            testmon-v1-${{ runner.os }}-${{ runner.arch }}-py3.13-

      - name: setup (blocking)
        # Why (flext-v4p5): explicit CI=Y on every make invocation (job env is not enough for matrix/docker parity).
        run: CI=Y make setup

      # `make setup` renders .envrc; direnv must re-allow it here because the
      # unattended smoke cannot answer `direnv allow`. Any content change
      # re-blocks, so the allow MUST run after every render — including this one.
      - name: direnv allow (rendered .envrc)
        run: direnv allow "${{ github.workspace }}/.envrc"

      - name: gen check (blocking)
        run: CI=Y make gen WHAT=check

      - name: check (blocking)
        # Why (flext-v4p5): explicit CI=Y on every make invocation (job env is not enough for matrix/docker parity).
        run: CI=Y make check

      # Why (aihub-v01jg): CI=Y runs ONE HALF of the gate set
      # (lint pyright security markdown smells direnv); the complement
      # (pyrefly mypy) is owned by
      # CI=N and, without this step, ran on developer
      # machines only. That split let real defects reach main twice: five
      # missing-attribute errors and an inconsistent-inheritance error, each
      # green in CI and red locally. The two contexts are strict complements by
      # construction, so running both here costs one extra pass and closes the
      # hole rather than trusting everyone to run the other half by hand.
      - name: check complement (blocking)
        run: CI=N make check

      - name: test (blocking)
        # Why (flext-v4p5): explicit CI=Y on every make invocation (job env is not enough for matrix/docker parity).
        run: CI=Y make test

      - name: Dump reports on failure
        if: ${{ failure() }}
        run: |
          set -eu
          # Structured reports only — same allowlist as Upload reports (no raw
          # pytest/tool logs: those may carry connection strings / env secrets).
          for report_root in .reports apps; do
            if [ -d "$report_root" ]; then
              find "$report_root" \
                \( -path '*/junit.xml' -o -path '*/coverage.xml' -o -path '*/coverage.json' \) \
                -type f -exec sh -eu -c '
                  for report_file do
                    printf "::group::%s\n" "$report_file"
                    tail -n 200 "$report_file"
                    printf "::endgroup::\n"
                  done
                ' sh {} +
            fi
          done
      - name: Upload reports on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: flext-ci-reports-${{ github.run_id }}
          # Structured reports only — omit raw pytest/tool logs that may carry
          # connection strings or env-derived secrets from integration fixtures.
          path: |
            .reports/**/junit.xml
            .reports/**/coverage.xml
            .reports/**/coverage.json
            apps/*/.reports/**/junit.xml
            apps/*/.reports/**/coverage.xml
            apps/*/.reports/**/coverage.json
          if-no-files-found: ignore
          retention-days: 7
  # End SECTION: ci job

  # === SECTION: merge-guard job (managed) ===
  merge-guard:
    name: merge-guard
    permissions:
      contents: read
    # Draft is the typed WIP state: no repository Action is selected until the
    # operator promotes the same PR to Review with a non-WIP head.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout promoted head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
      - name: Block WIP heads from protected integration branches
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -eu
          case "$BASE_REF" in
            dev|develop|0.12.0-dev)
              ;;
            *)
              echo "Merge guard passed for $(git rev-parse HEAD) -> $BASE_REF"
              exit 0
              ;;
          esac
          subject=$(git log -1 --format=%s)
          if [[ "$subject" == \[WIP\]* ]]; then
            echo "WIP head cannot merge into ${BASE_REF}: ${subject}"
            exit 1
          fi
          echo "Merge guard passed for $(git rev-parse HEAD) -> $BASE_REF"
  # End SECTION: merge-guard job
