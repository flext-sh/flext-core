name: CI

# === SECTION: triggers (managed) ===
# Source: CI policy — integration push/PR = blocking CI only;
# main push/PR (non-draft) = blocking CI; draft and other branches = none;
# workflow_call changes no direct-run behavior and declares the optional
# cross-repo dependency-credential secret contract in workflow scope.
"on":
  workflow_dispatch:
  push:
    branches:
      - main
      - 0.12.0-dev
  pull_request:
    branches:
      - main
      - 0.12.0-dev
    # No `edited`: a title edit must not cancel a running CI. The release
    # title guard reacts to edits in its own workflow (release-plan.yml).
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
    inputs:
      ref:
        description: Exact candidate commit to validate instead of the caller event SHA.
        required: false
        type: string
        default: ""
    secrets:
      CI_DEPENDENCIES_APP_ID:
        required: false
        description: >-
          Cross-repo dependency GitHub App id, required only by a repository
          that declares private dependencies; when it is absent there, the
          credential step records NOT EXECUTED and fails.
      CI_DEPENDENCIES_APP_PRIVATE_KEY:
        required: false
        description: >-
          Optional GitHub App private key minting the short-lived installation
          token for cross-repo private git dependencies.
# End SECTION: triggers

# Why: one active run per workflow and branch prevents obsolete CI from consuming runners.
# The event and PR number keep pull_request runs out of the integration push
# group: a PR event delivered after its merge resolves github.ref to the base
# branch and, keyed by ref alone, cancelled the post-merge run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ inputs.ref || (github.event_name == 'pull_request' && github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  # === SECTION: ci job (managed) ===
  # Source: template + config:github_actions.*
  ci:
    name: ci
    # Only the checkout job needs repository contents; packages: read is
    # granted solely to distributions declared in codegen
    # ci_package_registry_read, whose gates resolve GitHub Packages.
    permissions:
      contents: read
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: Y
      GITHUB_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: flext-core
    steps:
      - name: Checkout workspace flext-sh/flext
        uses: actions/checkout@v7
        with:
          repository: flext-sh/flext
          ref: 0.12.0-dev
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0
      - name: Pin flext-core at the tested commit
        working-directory: .
        run: |
          set -eu
          git -C "flext-core" fetch --no-tags origin "${{ inputs.ref || github.sha }}"
          git -C "flext-core" checkout --detach FETCH_HEAD
      # Why: GitHub runners expose umask 002, so git checkout materializes
      # group-writable modes (0664) for tracked files. Canonical Mise
      # artifacts demand exact modes (0o644) and the conform gate fails loud
      # on any drift, so checkout content is normalized to canonical modes
      # once, before any gate runs.
      - name: Normalize checkout modes
        working-directory: .
        run: chmod -R go-w .

      # Why: every fresh runner paid a cold full-dependency Mypy,
      # Pyrefly and Ruff analysis. The caches below are content-addressed by the
      # committed dependency locks, so a warm cache is always valid for the same
      # lock and can never hide a finding; it only removes the cold recompute.
      # Why: the same pair keeps the locked Mise tool storage, so
      # a cold runner never re-downloads the pinned tarballs, where a network
      # blip failed setup.
      # Why: the cache keeps Mise's installs and downloads but never its shims.
      # A restored shim points at the Mise binary of an earlier run, which Mise
      # treats as unmanaged ("not replacing unmanaged file in shims directory",
      # one warning per tool); Mise regenerates the shims from mise.lock.
      # The key is the content hash of the locks that decide what is
      # installed: one immutable entry per lock state, never one per run, so
      # saving never evicts the testmon cache with duplicate generations.
      # Only that exact key restores. A prefix fallback restored the previous
      # lock state, whose superseded installs and wheels the next save kept:
      # the entry grew with every lock change (algar-oud-mig: 3.06 to
      # 3.65 GiB) until its restore filled the runner disk. A lock change
      # installs cold and saves exactly the new state.
      - name: Restore tool caches
        id: tool-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            __pycache__
            .mypy_cache
            .pytest_cache
            .ruff_cache
            .pyrefly_cache
            .benchmarks
            .hypothesis
            .bin
            ~/.cache/uv
            ~/.local/share/mise
            !~/.local/share/mise/shims
          key: ${{ runner.os }}-3.13-tools-${{ hashFiles('uv.lock', 'mise.lock', 'pyproject.toml', '.mise.toml') }}

      # Setup obtains any remaining declared members after authentication,
      # then installs the native shared workspace noneditable. It acquires Mise
      # officially and installs the toolchain and dependencies from their locks,
      # publishes that environment through GITHUB_PATH, and prepares the
      # project runtime. CI never runs `make upg`: it never re-resolves.
      # CI approval, one visible step per ci workflow row (setup -> check).
      - name: make setup (blocking)
        id: approval-setup
        run: CI=Y make setup
      # CI approval, one visible step per ci workflow row (setup -> check).
      - name: make check CHECK_PHASE=primary (blocking)
        id: approval-check-primary
        # Every approval verb reports once setup provisioned the environment,
        # so one red verdict never hides the others; a declared requirement
        # (workflow requires) admits the step only after that verb is green.
        if: ${{ !cancelled() && steps.approval-setup.outcome == 'success' }}
        run: CI=Y make check CHECK_PHASE=primary
      # Reports exist once any approval row after setup executed, whichever
      # row failed first (a failed tests row skips every later check row);
      # uploading after a setup failure would only add a second, misleading error.
      - name: Upload execution reports
        if: ${{ !cancelled() && (steps.approval-check-primary.outcome == 'success' || steps.approval-check-primary.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: flext-ci-reports-${{ github.run_id }}
          # Structured reports only — omit raw pytest/tool logs that may carry
          # connection strings or env-derived secrets from integration fixtures.
          path: |
            flext-core/.reports/**/junit.xml
            flext-core/.reports/**/coverage.xml
            flext-core/.reports/**/coverage.json
            flext-core/.reports/**/audit-summary.json
            flext-core/.reports/**/audit-report.md
            flext-core/.reports/**/validate-summary.json
            flext-core/.reports/**/validate-report.md
            flext-core/.reports/check/**/*.sarif
            flext-core/.reports/check/**/*.md
            flext-core/.reports/gates/**/original-receipt.json
            flext-core/.reports/gates/**/check/**/*.sarif
            flext-core/.reports/gates/**/check/**/*.md
            flext-core/.reports/codegen-plan.json
            flext-core/.reports/codegen-publication.json
            flext-core/.reports/codegen-publication/**/*.json
            flext-core/.reports/setup-operations/*.json
            flext-core/.reports/tests/**/*.json
            flext-core/.reports/tests/**/summary.txt
            flext-core/.reports/tests/**/failed-tests.txt
            flext-core/.reports/tests/**/errors.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      # Why: a failed gate's job log prints only counts; its raw receipts under
      # the declared gate receipts directory are the evidence. Only approval
      # rows capture receipts, so the upload runs exactly when one of them
      # failed (tests included), never after a setup failure that left none.
      - name: Upload gate receipts on failure
        if: ${{ failure() && (steps.approval-check-primary.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: flext-gate-receipts-${{ github.job }}-${{ github.run_id }}
          path: flext-core/.reports/gates/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # The lock-hash key is immutable: save only when the exact key missed,
      # after a failing gate as well, so the next run starts warm.
      - name: Save tool caches
        # Native cache action access mode remains authoritative before upload.
        # Only declared events may publish; fork requests remain restore-only.
        # An exact hit already holds this lock state: save only on a miss.
        if: >-
          ${{ always() && !cancelled() && steps.tool-cache.outcome == 'success' && steps.tool-cache.outputs.cache-hit != 'true' && steps.tool-cache.outputs.cache-primary-key != '' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
        uses: actions/cache/save@v6
        with:
          path: |
            __pycache__
            .mypy_cache
            .pytest_cache
            .ruff_cache
            .pyrefly_cache
            .benchmarks
            .hypothesis
            .bin
            ~/.cache/uv
            ~/.local/share/mise
            !~/.local/share/mise/shims
          key: ${{ steps.tool-cache.outputs.cache-primary-key }}

  # End SECTION: ci job
