        id: tool-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            __pycache__
            .mypy_cache
            .pytest_cache
            .ruff_cache
            .pyrefly_cache
            .benchmarks
            .hypothesis
            ~/.cache/uv
            ~/.local/share/mise
