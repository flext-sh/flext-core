name: CI

# === SECTION: triggers (managed) ===
# Source: operator CI policy — integration push = blocking CI only;
# main push/PR (non-draft) = blocking CI; draft and other branches = none.
"on":
  push:
    branches:
      - dev
      - develop
      - 0.12.0-dev
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
# End SECTION: triggers

# === SECTION: permissions (managed) ===
# Source: template (minimal read-only permissions)
permissions:
  contents: read
# End SECTION: permissions

# Why: one active run per workflow and branch prevents obsolete CI from consuming runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # === SECTION: ci job (managed) ===
  # Source: template + config:github_actions.*
  ci:
    name: ci
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: Y
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          fetch-depth: 0

      - name: Install mise toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14  # v4.2.3

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0


      - name: setup (blocking)
        run: make setup

      - name: gen (blocking)
        run: make gen WHAT=apply APPLY=Y

      - name: fmt (blocking)
        run: make fmt WHAT=apply APPLY=Y

      - name: fix (blocking)
        run: make fix WHAT=apply APPLY=Y

      - name: check (blocking)
        run: make check

      - name: test (blocking)
        run: make test

      - name: Dump reports on failure
        if: ${{ failure() }}
        run: |
          set -eu
          for f in .reports/workspace/test/*.log; do
            [ -f "$f" ] || continue
            echo "::group::workspace $(basename "$f")"
            tail -n 200 "$f"
            echo "::endgroup::"
          done
          for f in apps/*/.reports/tests/*/pytest.log .reports/tests/*/pytest.log; do
            [ -f "$f" ] || continue
