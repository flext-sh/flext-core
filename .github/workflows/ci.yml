  # === SECTION: merge-guard job (managed) ===
  merge-guard:
    name: merge-guard
    permissions:
      contents: read
    # Draft is the typed WIP state: no repository Action is selected until the
    # same PR is promoted to Review with a non-WIP head.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout promoted head
        uses: actions/checkout@v7
