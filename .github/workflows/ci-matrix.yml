# Generated by `flext_infra codegen conform` for flext-core.
# === SECTION: header (managed) ===
# Source: template (base/.github/workflows/ci-matrix.yml.j2)
# Free: no
# End SECTION: header
# Multi-environment CI base: proves the project bootstrap and canonical Make
# verbs work identically across distros, macOS, and Windows. The CI invokes
# the project's own Make surface; it never reimplements bootstrap.
---
name: ci-matrix

# === SECTION: triggers (managed) ===
# Source: config:repository_branch
"on":
  push:
    branches: [0.12.0-dev]
  pull_request:
    branches: [0.12.0-dev]
  workflow_dispatch: {}
# End SECTION: triggers

# === SECTION: permissions (managed) ===
# Source: template (minimal read-only permissions)
permissions:
  contents: read
# End SECTION: permissions

# === SECTION: concurrency (managed) ===
# Source: template (one run per workflow+ref)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# End SECTION: concurrency

jobs:
  # === SECTION: distro-matrix (managed) ===
  # Source: template + config:github_actions.checkout (distro list is template literal by design)
  distro-matrix:
    # Clean-machine proof per distro: build the distro image (which runs the
    # full project bootstrap at image-build time), then smoke the verb surface
    # inside the built container.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu, debian, fedora, alpine, arch]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
      - name: Build ${{ matrix.distro }} image
        run: >-
          docker build
          -f ci/docker/${{ matrix.distro }}.Dockerfile
          -t ci-matrix-${{ matrix.distro }}
          .
      - name: Bootstrap + verb smoke (${{ matrix.distro }})
        run: |
          docker run --rm ci-matrix-${{ matrix.distro }} make help
          docker run --rm ci-matrix-${{ matrix.distro }} make check
  # End SECTION: distro-matrix

  # === SECTION: macos (managed) ===
  # Source: template + config:github_actions.checkout/setup-python/mise/setup-uv
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          submodules: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install mise toolchain
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925  # v4.1.0
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - name: Bootstrap
        run: make setup
      - name: Verb surface
        run: make help
  # End SECTION: macos

  # === SECTION: windows (managed) ===
  # Source: template + config:github_actions.checkout/setup-python/mise/setup-uv
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          submodules: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install mise toolchain
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925  # v4.1.0
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - name: Bootstrap
        shell: bash
        run: make setup
      - name: Verb surface
        shell: bash
        run: make help
  # End SECTION: windows
