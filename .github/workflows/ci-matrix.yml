# Generated by `flext_infra codegen conform` for flext-core.
# === SECTION: header (managed) ===
# Source: template (base/.github/workflows/ci-matrix.yml.j2)
# Free: no
# End SECTION: header
# Multi-environment CI base: proves the project bootstrap and canonical Make
# verbs work identically across distros, macOS, and Windows. The CI invokes
# the project's own Make surface; it never reimplements bootstrap.
# Projected identically for workspace and standalone repositories. Workspace
# projects are covered by the root matrix.
# Never bind triggers to the integration-line variable.
---
name: ci-matrix

# === SECTION: triggers (managed) ===
# Source: static dispatch-only policy; no pull_request or integration-line binding.
"on":
  workflow_dispatch: {}
# End SECTION: triggers


# === SECTION: permissions (managed) ===
# Source: template (minimal read-only permissions)
permissions:
  contents: read
# End SECTION: permissions

# === SECTION: concurrency (managed) ===
# Source: template (one manual run per workflow, event and ref).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
# End SECTION: concurrency

jobs:
  # === SECTION: distro-matrix (managed) ===
  # Source: template + config:github_actions.checkout (distro list is template literal by design)
  distro-matrix:
    # Clean-machine proof per distro: build the distro image (which runs the
    # full project bootstrap at image-build time), then smoke the verb surface
    # inside the built container.
    runs-on: ubuntu-latest
    env:
      CI: Y
      GITHUB_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu, debian, fedora, alpine, arch]
    steps:
      - name: Checkout workspace flext-sh/flext
        uses: actions/checkout@v7
        with:
          repository: flext-sh/flext
          ref: 0.12.0-dev
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0
      - name: Pin flext-core at the tested commit
        working-directory: .
        run: |
          set -eu
          git -C "flext-core" fetch --no-tags origin "${{ github.sha }}"
          git -C "flext-core" checkout --detach FETCH_HEAD
      # An attached member builds from its workspace checkout, whose root lock
      # it installs, and runs its own verbs from its member directory.
      - name: Build ${{ matrix.distro }} image
        run: >-
          docker build
          -f flext-core/tests/fixtures/ci/docker/${{ matrix.distro }}.Dockerfile
          --build-context git=.git
          --secret id=github_token,env=GITHUB_TOKEN
          -t ci-matrix-${{ matrix.distro }}
          .
      # Every distro runs the ordered public acceptance steps
      # (make.lifecycle_steps, ci context) inside its clean-machine image.
      - name: Lifecycle acceptance (${{ matrix.distro }})
        run: >-
          docker run --rm
          -e CI=Y
          -e GITHUB_TOKEN
          -w /workspace/flext-core
          ci-matrix-${{ matrix.distro }}
          bash -ec 'make help && make setup && make check CHECK_PHASE=primary && make tests && make gen && make gen && make fmt && make fix && make mod && make gen && make gen && make check CHECK_PHASE=primary && make check && make tests && make build'
  # End SECTION: distro-matrix

  # === SECTION: macos (managed) ===
  # Source: template + config:github_actions.checkout + generated Make setup
  macos:
    runs-on: macos-latest
    env:
      CI: Y
      GITHUB_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: flext-core
    steps:
      - name: Checkout workspace flext-sh/flext
        uses: actions/checkout@v7
        with:
          repository: flext-sh/flext
          ref: 0.12.0-dev
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0
      - name: Pin flext-core at the tested commit
        working-directory: .
        run: |
          set -eu
          git -C "flext-core" fetch --no-tags origin "${{ github.sha }}"
          git -C "flext-core" checkout --detach FETCH_HEAD
      # The ordered public acceptance steps (make.lifecycle_steps, ci
      # context): the matrix never keeps its own verb list.
      - name: Lifecycle acceptance
        run: |
          CI=Y make help
          CI=Y make setup
          CI=Y make check CHECK_PHASE=primary
          CI=Y make tests
          CI=Y make gen
          CI=Y make gen
          CI=Y make fmt
          CI=Y make fix
          CI=Y make mod
          CI=Y make gen
          CI=Y make gen
          CI=Y make check CHECK_PHASE=primary
          CI=Y make check
          CI=Y make tests
          CI=Y make build
  # End SECTION: macos

  # === SECTION: windows (managed) ===
  # Source: template + config:github_actions.checkout + generated Make setup
  windows:
    runs-on: windows-latest
    env:
      CI: Y
      GITHUB_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: flext-core
    steps:
      - name: Checkout workspace flext-sh/flext
        uses: actions/checkout@v7
        with:
          repository: flext-sh/flext
          ref: 0.12.0-dev
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0
      - name: Pin flext-core at the tested commit
        working-directory: .
        run: |
          set -eu
          git -C "flext-core" fetch --no-tags origin "${{ github.sha }}"
          git -C "flext-core" checkout --detach FETCH_HEAD
      # The ordered public acceptance steps (make.lifecycle_steps, ci
      # context): the matrix never keeps its own verb list.
      - name: Lifecycle acceptance
        shell: bash
        run: |
          CI=Y make help
          CI=Y make setup
          CI=Y make check CHECK_PHASE=primary
          CI=Y make tests
          CI=Y make gen
          CI=Y make gen
          CI=Y make fmt
          CI=Y make fix
          CI=Y make mod
          CI=Y make gen
          CI=Y make gen
          CI=Y make check CHECK_PHASE=primary
          CI=Y make check
          CI=Y make tests
          CI=Y make build
# End SECTION: windows
