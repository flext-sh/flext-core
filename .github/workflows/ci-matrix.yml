# Generated by `flext_infra codegen conform` for flext-core.
# === SECTION: header (managed) ===
# Source: template (base/.github/workflows/ci-matrix.yml.j2)
# Free: no
# End SECTION: header
# Multi-environment CI base: proves the project bootstrap and canonical Make
# verbs work identically across distros, macOS, and Windows. The CI invokes
# the project's own Make surface; it never reimplements bootstrap.
# Projected identically for workspace and standalone repositories. Workspace
# projects are covered by the root matrix.
# Never bind triggers to the integration-line variable.
---
name: ci-matrix

# === SECTION: triggers (managed) ===
# Source: static dispatch-only policy; no pull_request or integration-line binding.
"on":
  workflow_dispatch: {}
# End SECTION: triggers


# === SECTION: permissions (managed) ===
# Source: template (minimal read-only permissions)
permissions:
  contents: read
# End SECTION: permissions

# === SECTION: concurrency (managed) ===
# Source: template (one run per workflow+ref)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# End SECTION: concurrency

jobs:
  # === SECTION: distro-matrix (managed) ===
  # Source: template + config:github_actions.checkout (distro list is template literal by design)
  distro-matrix:
    # Clean-machine proof per distro: build the distro image (which runs the
    # full project bootstrap at image-build time), then smoke the verb surface
    # inside the built container.
    runs-on: ubuntu-latest
    env:
      CI: Y
      GITHUB_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu, debian, fedora, alpine, arch]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          # No step needs authenticated git after checkout; persisting the
          # token into .git/config would expose it to every later command.
          persist-credentials: false
      - name: Build ${{ matrix.distro }} image
        run: >-
          docker build
          -f tests/fixtures/ci/docker/${{ matrix.distro }}.Dockerfile
          --build-context git=.git
          --secret id=github_token,env=GITHUB_TOKEN
          -t ci-matrix-${{ matrix.distro }}
          .
      - name: Bootstrap + verb smoke (${{ matrix.distro }})
        env:
          CI: Y
        run: |
          docker run --rm -e CI=Y -e GITHUB_TOKEN ci-matrix-${{ matrix.distro }} make help
          docker run --rm -e CI=Y -e GITHUB_TOKEN ci-matrix-${{ matrix.distro }} make check
      - name: Regenerate and validate on Linux
        if: ${{ matrix.distro == 'ubuntu' }}
        run: >-
          docker run --rm
          -e CI=Y
          -e GITHUB_TOKEN
          ci-matrix-ubuntu
          bash -ec 'make setup && make gen && make gen && make check && make test && make build'
  # End SECTION: distro-matrix

  # === SECTION: macos (managed) ===
  # Source: template + config:github_actions.checkout + generated Make setup
  macos:
    runs-on: macos-latest
    env:
      CI: Y
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          # No step needs authenticated git after checkout; persisting the
          # token into .git/config would expose it to every later command.
          persist-credentials: false
      - name: Install the mise release declared by mise.lock or .mise.toml
        shell: bash
        run: |
          set -eu
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64) mise_platform=linux-x64; mise_suffix=tar.gz ;;
            Linux-ARM64) mise_platform=linux-arm64; mise_suffix=tar.gz ;;
            macOS-X64) mise_platform=macos-x64; mise_suffix=tar.gz ;;
            macOS-ARM64) mise_platform=macos-arm64; mise_suffix=tar.gz ;;
            Windows-X64) mise_platform=windows-x64; mise_suffix=zip ;;
            *) echo "ERROR: no mise release platform for ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 2 ;;
          esac
          mise_lock_usable=0
          if [ -f mise.lock ] && ! grep -qE '^(<<<<<<< |=======$|>>>>>>> )' mise.lock; then
            mise_lock_usable=1
          fi
          mise_field() {
            awk -v section="[tools.\"github:jdx/mise\".\"platforms.${mise_platform}\"]" -v key="$1" '
              $0 == section { inside = 1; next }
              inside && substr($0, 1, 1) == "[" { exit }
              inside && $1 == key { gsub(/"/, "", $3); print $3; exit }
            ' mise.lock
          }
          mise_pin=
          mise_url=
          mise_checksum=
          if [ "${mise_lock_usable}" = 1 ]; then
            mise_pin="$(awk 'index($0, "[[tools.\"github:jdx/mise\"]]") == 1 { inside = 1; next } inside && substr($0, 1, 1) == "[" { exit } inside && $1 == "version" { gsub(/[",]/, "", $3); print $3; exit }' mise.lock)"
            mise_url="$(mise_field url)"
            mise_checksum="$(mise_field checksum)"
          fi
          case "${mise_url}|${mise_checksum}" in
            https://github.com/jdx/mise/releases/download/*\|sha256:*) ;;
            *) mise_pin= ;;
          esac
          mise_stage="${RUNNER_TEMP}/mise-install"
          mkdir -p "${mise_stage}" "${HOME}/.local/bin"
          if [ -n "${mise_pin}" ]; then
            mise_release="${mise_pin}"
            mise_archive="${mise_stage}/${mise_url##*/}"
            curl --proto '=https' --tlsv1.2 -fsSL -o "${mise_archive}" "${mise_url}"
            mise_sha256="${mise_checksum#sha256:}"
          else
            mise_release="$(awk -F'"' '$2 == "github:jdx/mise" { print $4; exit }' .mise.toml)"
            if [ -z "${mise_release}" ]; then
              echo "ERROR: .mise.toml declares no github:jdx/mise release" >&2
              exit 2
            fi
            mise_asset="mise-v${mise_release}-${mise_platform}.${mise_suffix}"
            mise_base="https://github.com/jdx/mise/releases/download/v${mise_release}"
            mise_archive="${mise_stage}/${mise_asset}"
            curl --proto '=https' --tlsv1.2 -fsSL -o "${mise_archive}" "${mise_base}/${mise_asset}"
            curl --proto '=https' --tlsv1.2 -fsSL -o "${mise_stage}/SHASUMS256.txt" "${mise_base}/SHASUMS256.txt"
            mise_sha256="$(awk -v asset="${mise_asset}" '$2 == asset || $2 == "./" asset { print $1; exit }' "${mise_stage}/SHASUMS256.txt")"
            if [ -z "${mise_sha256}" ]; then
              echo "ERROR: SHASUMS256.txt of mise v${mise_release} lists no ${mise_asset}" >&2
              exit 2
            fi
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            echo "${mise_sha256}  ${mise_archive}" | sha256sum -c -
          else
            echo "${mise_sha256}  ${mise_archive}" | shasum -a 256 -c -
          fi
          case "${mise_archive}" in
            *.zip) unzip -q "${mise_archive}" -d "${mise_stage}" ;;
            *) tar -xf "${mise_archive}" -C "${mise_stage}" ;;
          esac
          if [ "${RUNNER_OS}" = "Windows" ]; then
            cp "${mise_stage}/mise/bin/mise.exe" "${HOME}/.local/bin/mise.exe"
          else
            install -m 0755 "${mise_stage}/mise/bin/mise" "${HOME}/.local/bin/mise"
          fi
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          echo "${HOME}/.local/share/mise/shims" >> "${GITHUB_PATH}"
          if [ "${mise_lock_usable}" = 0 ]; then
            # An unreadable lock is never read: no parse warning, no failure.
            export MISE_LOCKFILE=false
          fi
          if [ -n "${mise_pin}" ]; then
            "${HOME}/.local/bin/mise" install --locked github:jdx/mise
          else
            MISE_LOCKFILE=false "${HOME}/.local/bin/mise" install github:jdx/mise
          fi
          mise_path="$("${HOME}/.local/bin/mise" which mise)"
          mise_receipt="$("${mise_path}" --version | cut -d ' ' -f1)"
          if [ "${mise_receipt}" != "${mise_release}" ]; then
            printf 'ERROR: provisioned Mise %s differs from the declared release %s\n' "${mise_receipt}" "${mise_release}" >&2
            exit 2
          fi
          echo "${mise_path%/*}" >> "${GITHUB_PATH}"

      - name: Bootstrap
        run: CI=Y make setup
      - name: Generate twice
        run: |
          CI=Y make gen
          CI=Y make gen
      - name: Native gates
        run: |
          CI=Y make check
          CI=Y make test
          CI=Y make build
  # End SECTION: macos

  # === SECTION: windows (managed) ===
