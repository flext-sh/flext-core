# Generated by `flext-infra codegen conform` for flext-core — DO NOT EDIT.
name: Docs

"on":
  push:
    branches:
      - main
      - 0.12.0-dev
      - 0.20.0-dev
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"

      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs-quality:
    name: docs-quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0

      - name: Sync workspace toolchain
        run: make setup

      - name: Generation drift (blocking)
        run: make conform 

      - name: Docs lifecycle (blocking)
        run: make docs 

      # Failure diagnostics execute only after the original Make step has
      # already propagated its exact status to Actions.
      - name: Dump docs reports on failure
        if: failure()
        run: |
          set -eu
          for report_root in .reports apps; do
            if [ -d "$report_root" ]; then
              find "$report_root" \
                \( -path '*/audit-summary.json' -o -path '*/audit-report.md' \
                   -o -path '*/validate-summary.json' -o -path '*/validate-report.md' \) \
                -type f -exec sh -eu -c '
                  for report_file do
                    printf "::group::%s\n" "$report_file"
                    tail -n 80 "$report_file"
                    printf "::endgroup::\n"
                  done
                ' sh {} +
            fi
          done

      - name: Upload docs reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docs-reports
          # Structured docs reports only — omit raw docs log trees that may carry
          # env-derived secrets from setup/docs phases.
          path: |
            .reports/**/audit-summary.json
            .reports/**/audit-report.md
            .reports/**/validate-summary.json
            .reports/**/validate-report.md
            apps/*/.reports/**/audit-summary.json
            apps/*/.reports/**/audit-report.md
            apps/*/.reports/**/validate-summary.json
            apps/*/.reports/**/validate-report.md
          if-no-files-found: error
          retention-days: 7

  build:
    name: build
    needs: docs-quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0

      - name: Sync workspace toolchain
        run: make setup

      - name: Build site
        run: make docs 

      - name: Verify byte-identical repository
        run: |
          git diff --exit-code -- .
          git diff --cached --exit-code -- .

      # Pages configure/upload exist only to feed deploy on main. Running them on
      # every integration push fails closed when Pages is unset and is wasted
      # work when deploy is skipped (deploy already gates on refs/heads/main).
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .reports/docs/site

  deploy:
    name: deploy
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: ${{ 'github-pages' }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
