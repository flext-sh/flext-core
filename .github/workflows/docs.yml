name: Docs

"on":
  push:
    branches:
      - main
      - 0.12.0-dev
      - 0.20.0-dev
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"

      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs-quality:
    name: docs-quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # Why: GitHub-hosted runners share egress IPs, so the unauthenticated
    # 60 req/h REST budget is exhausted before mise resolves the moving
    # @latest backends (observed 2026-09-23: 403, rate limit 0/60, on every
    # backend in Sync workspace toolchain), and docs generation reads the
    # governed sibling repos. The job token authenticates both, as in CI.
    env:
      CI: Y
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0

      # Why: a cold runner re-downloaded every locked Mise tool
      # (go included) on every Docs run, and a network blip failed setup. The
      # cache is content-addressed by the committed locks, so a warm cache is
      # always valid for the same lock and can never hide a finding; it only
      # removes the cold download of the pinned tarballs.
      # Why: the cache keeps Mise's installs and downloads but never its shims.
      # A restored shim points at the Mise binary of an earlier run, which Mise
      # treats as unmanaged ("not replacing unmanaged file in shims directory",
      # one warning per tool); Mise regenerates the shims from mise.lock.
      - name: Restore tool caches
        id: tool-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            __pycache__
            .mypy_cache
            .pytest_cache
            .ruff_cache
            .pyrefly_cache
            .benchmarks
            .hypothesis
            ~/.cache/uv
            ~/.local/share/mise
            !~/.local/share/mise/shims
          key: ${{ runner.os }}-3.13-tools-${{ hashFiles('uv.lock', 'mise.lock', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-3.13-tools-

      - name: Install the mise release declared by mise.lock or .mise.toml
        shell: bash
        run: |
          set -eu
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64) mise_platform=linux-x64; mise_suffix=tar.gz ;;
            Linux-ARM64) mise_platform=linux-arm64; mise_suffix=tar.gz ;;
            macOS-X64) mise_platform=macos-x64; mise_suffix=tar.gz ;;
            macOS-ARM64) mise_platform=macos-arm64; mise_suffix=tar.gz ;;
            Windows-X64) mise_platform=windows-x64; mise_suffix=zip ;;
            *) echo "ERROR: no mise release platform for ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 2 ;;
          esac
          mise_lock_usable=0
          if [ -f mise.lock ] && ! grep -qE '^(<<<<<<< |=======$|>>>>>>> )' mise.lock; then
            mise_lock_usable=1
          fi
          mise_field() {
            awk -v section="[tools.\"github:jdx/mise\".\"platforms.${mise_platform}\"]" -v key="$1" '
              $0 == section { inside = 1; next }
              inside && substr($0, 1, 1) == "[" { exit }
              inside && $1 == key { gsub(/"/, "", $3); print $3; exit }
            ' mise.lock
          }
          mise_pin=
          mise_url=
          mise_checksum=
          if [ "${mise_lock_usable}" = 1 ]; then
            mise_pin="$(awk 'index($0, "[[tools.\"github:jdx/mise\"]]") == 1 { inside = 1; next } inside && substr($0, 1, 1) == "[" { exit } inside && $1 == "version" { gsub(/[",]/, "", $3); print $3; exit }' mise.lock)"
            mise_url="$(mise_field url)"
            mise_checksum="$(mise_field checksum)"
          fi
          case "${mise_url}|${mise_checksum}" in
            https://github.com/jdx/mise/releases/download/*\|sha256:*) ;;
            *) mise_pin= ;;
          esac
          mise_stage="${RUNNER_TEMP}/mise-install"
          mkdir -p "${mise_stage}" "${HOME}/.local/bin"
          if [ -n "${mise_pin}" ]; then
            mise_release="${mise_pin}"
            mise_archive="${mise_stage}/${mise_url##*/}"
            curl --proto '=https' --tlsv1.2 -fsSL -o "${mise_archive}" "${mise_url}"
            mise_sha256="${mise_checksum#sha256:}"
          else
            mise_release="$(awk -F'"' '$2 == "github:jdx/mise" { print $4; exit }' .mise.toml)"
            if [ -z "${mise_release}" ]; then
              echo "ERROR: .mise.toml declares no github:jdx/mise release" >&2
              exit 2
            fi
            mise_asset="mise-v${mise_release}-${mise_platform}.${mise_suffix}"
            mise_base="https://github.com/jdx/mise/releases/download/v${mise_release}"
            mise_archive="${mise_stage}/${mise_asset}"
            curl --proto '=https' --tlsv1.2 -fsSL -o "${mise_archive}" "${mise_base}/${mise_asset}"
            curl --proto '=https' --tlsv1.2 -fsSL -o "${mise_stage}/SHASUMS256.txt" "${mise_base}/SHASUMS256.txt"
            mise_sha256="$(awk -v asset="${mise_asset}" '$2 == asset || $2 == "./" asset { print $1; exit }' "${mise_stage}/SHASUMS256.txt")"
            if [ -z "${mise_sha256}" ]; then
              echo "ERROR: SHASUMS256.txt of mise v${mise_release} lists no ${mise_asset}" >&2
              exit 2
            fi
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            echo "${mise_sha256}  ${mise_archive}" | sha256sum -c -
          else
            echo "${mise_sha256}  ${mise_archive}" | shasum -a 256 -c -
          fi
          case "${mise_archive}" in
            *.zip) unzip -q "${mise_archive}" -d "${mise_stage}" ;;
            *) tar -xf "${mise_archive}" -C "${mise_stage}" ;;
          esac
          if [ "${RUNNER_OS}" = "Windows" ]; then
            cp "${mise_stage}/mise/bin/mise.exe" "${HOME}/.local/bin/mise.exe"
          else
            install -m 0755 "${mise_stage}/mise/bin/mise" "${HOME}/.local/bin/mise"
          fi
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          echo "${HOME}/.local/share/mise/shims" >> "${GITHUB_PATH}"
          if [ "${mise_lock_usable}" = 0 ]; then
            # An unreadable lock is never read: no parse warning, no failure.
            export MISE_LOCKFILE=false
          fi
          if [ -n "${mise_pin}" ]; then
            "${HOME}/.local/bin/mise" install --locked github:jdx/mise
          else
            MISE_LOCKFILE=false "${HOME}/.local/bin/mise" install github:jdx/mise
          fi
          mise_path="$("${HOME}/.local/bin/mise" which mise)"
          mise_receipt="$("${mise_path}" --version | cut -d ' ' -f1)"
          if [ "${mise_receipt}" != "${mise_release}" ]; then
            printf 'ERROR: provisioned Mise %s differs from the declared release %s\n' "${mise_receipt}" "${mise_release}" >&2
            exit 2
          fi
          echo "${mise_path%/*}" >> "${GITHUB_PATH}"

      - name: Sync workspace toolchain
        run: make setup

      # Why: save on every outcome — including a failing gate — so the next run
      # starts warm. Only written when the restore missed.
      - name: Save tool caches
        if: ${{ always() && steps.tool-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            __pycache__
            .mypy_cache
            .pytest_cache
            .ruff_cache
            .pyrefly_cache
            .benchmarks
            .hypothesis
            ~/.cache/uv
            ~/.local/share/mise
            !~/.local/share/mise/shims
          key: ${{ runner.os }}-3.13-tools-${{ hashFiles('uv.lock', 'mise.lock', 'pyproject.toml') }}


      - name: Generation drift (blocking)
        run: |
          make gen
          make verify-clean

      - name: Docs lifecycle (blocking)
        run: make docs

      # The preceding generation check cannot see changes made by make docs.
      - name: Verify docs byte-identical repository
        run: make verify-clean

      # Failure diagnostics execute only after the original Make step has
      # already propagated its exact status to Actions.
      - name: Dump docs reports on failure
        if: failure()
        run: |
          set -eu
          for report_root in .reports apps; do
            if [ -d "$report_root" ]; then
              find "$report_root" \
                \( -path '*/audit-summary.json' -o -path '*/audit-report.md' -o -path '*/validate-summary.json' -o -path '*/validate-report.md' \) \
                -type f -exec sh -eu -c '
                  for report_file do
                    printf "::group::%s\n" "$report_file"
                    tail -n 80 "$report_file"
                    printf "::endgroup::\n"
                  done
                ' sh {} +
            fi
          done

      - name: Upload docs reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docs-reports
          # Structured docs reports only — omit raw docs log trees that may carry
          # env-derived secrets from setup/docs phases.
          path: |
            .reports/**/audit-summary.json
            .reports/**/audit-report.md
            .reports/**/validate-summary.json
            .reports/**/validate-report.md
            apps/*/.reports/**/audit-summary.json
            apps/*/.reports/**/audit-report.md
            apps/*/.reports/**/validate-summary.json
            apps/*/.reports/**/validate-report.md
          if-no-files-found: error
          # The allowlisted reports live under hidden .reports directories.
          # upload-artifact excludes hidden paths unless this is explicit.
          include-hidden-files: true
          retention-days: 7

  build:
    name: build
    needs: docs-quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # The build job runs Configure Pages on main, and the Pages REST
