# Generated by `flext-infra codegen conform` for flext-core — DO NOT EDIT.
name: Docs

"on":
  push:
    branches:
      - main
      - 0.12.0-dev
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"

      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs-quality:
    name: docs-quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # Why: GitHub-hosted runners share egress IPs, so the unauthenticated
    # 60 req/h REST budget is exhausted before mise resolves the moving
    # @latest backends (observed 2026-09-23: 403, rate limit 0/60, on every
    # backend in Sync workspace toolchain), and docs generation reads the
    # governed sibling repos. The job token authenticates both, as in CI.
    env:
      CI: Y
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      # Why: a cold runner re-downloaded every locked Mise tool
      # (go included) on every Docs run, and a network blip failed setup. The
      # cache is content-addressed by the committed locks, so a warm cache is
      # always valid for the same lock and can never hide a finding; it only
      # removes the cold download of the pinned tarballs.
      # Why: the cache keeps Mise's installs and downloads but never its shims.
      # A restored shim points at the Mise binary of an earlier run, which Mise
      # treats as unmanaged ("not replacing unmanaged file in shims directory",
      # one warning per tool); Mise regenerates the shims from mise.lock.
      - name: Restore tool caches
        id: tool-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            __pycache__
            .mypy_cache
            .pytest_cache
            .ruff_cache
            .pyrefly_cache
            .benchmarks
            .hypothesis
            ~/.cache/uv
            ~/.local/share/mise
            !~/.local/share/mise/shims
          key: ${{ runner.os }}-3.13-tools-${{ hashFiles('uv.lock', 'mise.lock', 'pyproject.toml', '.mise.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-3.13-tools-${{ hashFiles('uv.lock', 'mise.lock', 'pyproject.toml', '.mise.toml') }}-
            ${{ runner.os }}-3.13-tools-


      - name: Sync workspace toolchain
        run: make setup

      # Why: save on every outcome — including a failing gate — so the next run
      # starts warm. Only written when the restore missed.
      - name: Save tool caches
        # Native cache action access mode remains authoritative before upload.
        # Only declared events may publish; fork requests remain restore-only.
        if: >-
          ${{ always() && !cancelled() && steps.tool-cache.outcome == 'success' && steps.tool-cache.outputs.cache-primary-key != '' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) || github.event_name == 'workflow_dispatch') }}
        uses: actions/cache/save@v6
        with:
          path: |
            __pycache__
            .mypy_cache
            .pytest_cache
            .ruff_cache
            .pyrefly_cache
            .benchmarks
            .hypothesis
            ~/.cache/uv
            ~/.local/share/mise
            !~/.local/share/mise/shims
          key: ${{ steps.tool-cache.outputs.cache-primary-key }}


      - name: Generate documentation
        run: make gen

      - name: Check documentation and projections
        run: make check

      # Failure diagnostics execute only after the original Make step has
      # already propagated its exact status to Actions.
      - name: Dump docs reports on failure
        if: failure()
        run: |
          set -eu
          for report_root in .reports apps; do
            if [ -d "${report_root}" ]; then
              find "${report_root}" \
                \( -path '*/audit-summary.json' -o -path '*/audit-report.md' -o -path '*/validate-summary.json' -o -path '*/validate-report.md' \) \
                -type f -exec sh -eu -c '
                  for report_file do
                    printf "::group::%s\n" "${report_file}"
                    cat "${report_file}"
                    printf "::endgroup::\n"
                  done
                ' sh {} +
            fi
          done

      - name: Upload docs reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docs-reports
          # Structured docs reports only — omit raw docs log trees that may carry
          # env-derived secrets from lifecycle commands.
          path: |
            .reports/**/audit-summary.json
            .reports/**/audit-report.md
            .reports/**/validate-summary.json
            .reports/**/validate-report.md
            apps/*/.reports/**/audit-summary.json
            apps/*/.reports/**/audit-report.md
            apps/*/.reports/**/validate-summary.json
            apps/*/.reports/**/validate-report.md
          if-no-files-found: error
          # The allowlisted reports live under hidden .reports directories.
          # upload-artifact excludes hidden paths unless this is explicit.
          include-hidden-files: true
          retention-days: 7

  build:
    name: build
    needs: docs-quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # The build job runs Configure Pages on main, and the Pages REST
      # endpoint rejects a token without Pages write even for reads
      # ("Resource not accessible by integration").
      pages: write
    # Why: same authenticated toolchain and docs-source resolution as docs-quality.
    env:
      CI: Y
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      # Why: same cold-download protection as the docs-quality job.
      # Why: the cache keeps Mise's installs and downloads but never its shims.
      # A restored shim points at the Mise binary of an earlier run, which Mise
      # treats as unmanaged ("not replacing unmanaged file in shims directory",
      # one warning per tool); Mise regenerates the shims from mise.lock.
      - name: Restore tool caches
        id: tool-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            __pycache__
            .mypy_cache
            .pytest_cache
            .ruff_cache
            .pyrefly_cache
            .benchmarks
            .hypothesis
            ~/.cache/uv
            ~/.local/share/mise
            !~/.local/share/mise/shims
          key: ${{ runner.os }}-3.13-tools-${{ hashFiles('uv.lock', 'mise.lock', 'pyproject.toml', '.mise.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-3.13-tools-${{ hashFiles('uv.lock', 'mise.lock', 'pyproject.toml', '.mise.toml') }}-
            ${{ runner.os }}-3.13-tools-


      - name: Sync workspace toolchain
        run: make setup
      - name: Save tool caches
        # Native cache action access mode remains authoritative before upload.
        # Only declared events may publish; fork requests remain restore-only.
        if: >-
          ${{ always() && !cancelled() && steps.tool-cache.outcome == 'success' && steps.tool-cache.outputs.cache-primary-key != '' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) || github.event_name == 'workflow_dispatch') }}
        uses: actions/cache/save@v6
        with:
          path: |
            __pycache__
            .mypy_cache
            .pytest_cache
            .ruff_cache
            .pyrefly_cache
            .benchmarks
            .hypothesis
            ~/.cache/uv
            ~/.local/share/mise
            !~/.local/share/mise/shims
          key: ${{ steps.tool-cache.outputs.cache-primary-key }}


      - name: Generate documentation
        run: make gen

      - name: Build site
        run: make build

      - name: Check documentation and projections
        run: make check

      # Pages configure/upload exist only to feed deploy on main. Running them on
      # every integration push fails closed when Pages is unset and is wasted
      # work when deploy is skipped (deploy already gates on refs/heads/main).
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .reports/docs/site

  deploy:
    name: deploy
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
