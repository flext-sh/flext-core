# Generated by `flext-infra codegen conform` for flext-core — DO NOT EDIT.
name: Docs

"on":
  push:
    branches:
      - main
      - 0.12.0-dev
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"

      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions: {}

jobs:
  docs-quality:
    name: docs-quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Why: a newer push to the same branch makes this proof obsolete, so it is
    # cancelled. The group holds only this job: a started deploy, when the site
    # is published, sits in its own non-cancelling group and always finishes.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    # packages: read only for distributions declared in codegen
    # ci_package_registry_read: make gen/check resolve their GitHub Packages.
    permissions:
      contents: read
    # Why: GitHub-hosted runners share egress IPs, so the unauthenticated
    # 60 req/h REST budget is exhausted before mise resolves the moving
    # @latest backends (observed 2026-09-23: 403, rate limit 0/60, on every
    # backend in Sync workspace toolchain), and docs generation reads the
    # governed sibling repos. The job token authenticates both, as in CI.
    env:
      CI: Y
      GITHUB_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: flext-core
    steps:
      - name: Checkout workspace flext-sh/flext
        uses: actions/checkout@v7
        with:
          repository: flext-sh/flext
          ref: 0.12.0-dev
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0
      - name: Pin flext-core at the tested commit
        working-directory: .
        run: |
          set -eu
          git -C "flext-core" fetch --no-tags origin "${{ github.sha }}"
          git -C "flext-core" checkout --detach FETCH_HEAD

      # Why: a cold runner re-downloaded every locked Mise tool
      # (go included) on every Docs run, and a network blip failed setup. The
      # cache is content-addressed by the committed locks, so a warm cache is
      # always valid for the same lock and can never hide a finding; it only
      # removes the cold download of the pinned tarballs.
      # Why: the cache keeps Mise's installs and downloads but never its shims.
      # A restored shim points at the Mise binary of an earlier run, which Mise
      # treats as unmanaged ("not replacing unmanaged file in shims directory",
      # one warning per tool); Mise regenerates the shims from mise.lock.
      # The key is the content hash of the locks that decide what is
      # installed: one immutable entry per lock state, never one per run, so
      # duplicate generations never consume the repository cache quota.
      # Only that exact key restores. A prefix fallback restored the previous
      # lock state, whose superseded installs and wheels the next save kept:
      # the entry grew with every lock change until its restore filled the
      # runner disk. A lock change
      # installs cold and saves exactly the new state.
      - name: Restore tool caches
        id: tool-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            __pycache__
            .pytest_cache
            .ruff_cache
            .pyrefly_cache
            .benchmarks
            .hypothesis
            ~/.local/bin/mise
            ~/.cache/uv
            ~/.local/share/mise
            !~/.local/share/mise/shims
          key: ${{ runner.os }}-3.13-tools-${{ hashFiles('uv.lock', 'mise.lock', 'pyproject.toml', '.mise.toml') }}


      - name: Sync workspace toolchain
        run: make setup

      # Why: save on every outcome — including a failing gate — so the next run
      # starts warm. Only written when the restore missed.
      - name: Save tool caches
        # Native cache action access mode remains authoritative before upload.
        # Only branch pushes and explicit dispatch publish. A pull request
        # restores only: its entry is scoped to refs/pull/N/merge, visible to no
        # other ref, so saving it stored one ~700 MB copy of the same lock state
        # per PR until the repository quota evicted the integration branch's
        # entry. An exact hit already holds this lock state: save only on a miss.
        if: >-
          ${{ always() && !cancelled() && steps.tool-cache.outcome == 'success' && steps.tool-cache.outputs.cache-hit != 'true' && steps.tool-cache.outputs.cache-primary-key != '' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) || github.event_name == 'workflow_dispatch') }}
        uses: actions/cache/save@v6
        with:
          path: |
            __pycache__
            .pytest_cache
            .ruff_cache
            .pyrefly_cache
            .benchmarks
            .hypothesis
            ~/.local/bin/mise
            ~/.cache/uv
            ~/.local/share/mise
            !~/.local/share/mise/shims
          key: ${{ steps.tool-cache.outputs.cache-primary-key }}


      - name: Generate documentation
        run: make gen

      - name: Build site
        run: make build

      # One check per run, on the tree the site was built from.
      - name: Check documentation and projections
        run: make check

      # The site artifact exists only to feed deploy on main; an integration
      # push proves the build and uploads nothing.
      - name: Upload site artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: flext-core/.reports/docs/site

      # Failure diagnostics execute only after the original Make step has
      # already propagated its exact status to Actions.
      - name: Dump docs reports on failure
        if: failure()
        run: |
          set -eu
          for report_root in .reports apps; do
            if [ -d "${report_root}" ]; then
              find "${report_root}" \
                \( -path '*/audit-summary.json' -o -path '*/audit-report.md' -o -path '*/validate-summary.json' -o -path '*/validate-report.md' \) \
                -type f -exec sh -eu -c '
                  for report_file do
                    printf "::group::%s\n" "${report_file}"
                    cat "${report_file}"
                    printf "::endgroup::\n"
                  done
                ' sh {} +
            fi
          done

      - name: Upload docs reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docs-reports
          # Structured docs reports only — omit raw docs log trees that may carry
          # env-derived secrets from lifecycle commands.
          path: |
            flext-core/.reports/**/audit-summary.json
            flext-core/.reports/**/audit-report.md
            flext-core/.reports/**/validate-summary.json
            flext-core/.reports/**/validate-report.md
            flext-core/apps/*/.reports/**/audit-summary.json
            flext-core/apps/*/.reports/**/audit-report.md
            flext-core/apps/*/.reports/**/validate-summary.json
            flext-core/apps/*/.reports/**/validate-report.md
          if-no-files-found: error
          # The allowlisted reports live under hidden .reports directories.
          # upload-artifact excludes hidden paths unless this is explicit.
          include-hidden-files: true
          retention-days: 7

  deploy:
    name: deploy
    needs: docs-quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A running publication to Pages is never cancelled; a newer one waits.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      # Configure Pages reads the Pages REST endpoint, which rejects a token
      # without Pages write ("Resource not accessible by integration"); only
      # this job, which runs no project code, holds it.
      pages: write
      id-token: write
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
