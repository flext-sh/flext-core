name: Docs

"on":
  push:
    branches:
      - main
      - 0.12.0-dev
      - 0.20.0-dev
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"

      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs-quality:
    name: docs-quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          fetch-depth: 0

      # A private git dependency cannot be cloned with the workflow's own
      # token: secrets.GITHUB_TOKEN is scoped to the repository that runs the
      # workflow, and uv drives dependency clones through plain git, which
      # carries no credential at all. The declared App mints an installation
      # token for the owner, and git reads it from a 0600 file outside the
      # checkout — never from the environment of the build itself.
      - name: Mint the private-dependency installation token
        id: private_dependency_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.CI_DEPENDENCIES_APP_ID }}
          private-key: ${{ secrets.CI_DEPENDENCIES_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Authenticate git for private dependencies
        env:
          PRIVATE_DEPENDENCY_TOKEN: ${{ steps.private_dependency_token.outputs.token }}
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required for private dependency identity}"
          if [ -z "${PRIVATE_DEPENDENCY_TOKEN}" ]; then
            echo "::error::the CI_DEPENDENCIES_APP_ID App produced no installation token — a private git dependency cannot be resolved"
            exit 1
          fi
          store="$RUNNER_TEMP/flext-private-dependency-credentials"
          install -m 600 /dev/null "$store"
          printf 'https://x-access-token:%s@github.com\n' "$PRIVATE_DEPENDENCY_TOKEN" > "$store"
          git config --global credential.helper "store --file=$store"

      - name: Sync workspace toolchain
        run: make setup

      - name: Generation drift (blocking)
        run: make conform APPLY=Y

      - name: Docs lifecycle (blocking)
        run: make docs APPLY=Y

      # Failure diagnostics execute only after the original Make step has
      # already propagated its exact status to Actions.
      - name: Dump docs reports on failure
        if: failure()
        run: |
          set -eu
          for report_root in .reports apps; do
            if [ -d "$report_root" ]; then
              find "$report_root" \
                \( -path '*/audit-summary.json' -o -path '*/audit-report.md' \
                   -o -path '*/validate-summary.json' -o -path '*/validate-report.md' \) \
                -type f -exec sh -eu -c '
                  for report_file do
                    printf "::group::%s\n" "$report_file"
                    tail -n 80 "$report_file"
                    printf "::endgroup::\n"
                  done
                ' sh {} +
            fi
          done

      - name: Upload docs reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: docs-reports
          # Structured docs reports only — omit raw docs log trees that may carry
          # env-derived secrets from setup/docs phases.
          path: |
            .reports/**/audit-summary.json
            .reports/**/audit-report.md
            .reports/**/validate-summary.json
            .reports/**/validate-report.md
            apps/*/.reports/**/audit-summary.json
            apps/*/.reports/**/audit-report.md
            apps/*/.reports/**/validate-summary.json
            apps/*/.reports/**/validate-report.md
          if-no-files-found: error
          retention-days: 7

  build:
    name: build
    needs: docs-quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          fetch-depth: 0

      # A private git dependency cannot be cloned with the workflow's own
      # token: secrets.GITHUB_TOKEN is scoped to the repository that runs the
      # workflow, and uv drives dependency clones through plain git, which
      # carries no credential at all. The declared App mints an installation
      # token for the owner, and git reads it from a 0600 file outside the
      # checkout — never from the environment of the build itself.
      - name: Mint the private-dependency installation token
        id: private_dependency_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.CI_DEPENDENCIES_APP_ID }}
          private-key: ${{ secrets.CI_DEPENDENCIES_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Authenticate git for private dependencies
        env:
          PRIVATE_DEPENDENCY_TOKEN: ${{ steps.private_dependency_token.outputs.token }}
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required for private dependency identity}"
          if [ -z "${PRIVATE_DEPENDENCY_TOKEN}" ]; then
            echo "::error::the CI_DEPENDENCIES_APP_ID App produced no installation token — a private git dependency cannot be resolved"
            exit 1
          fi
          store="$RUNNER_TEMP/flext-private-dependency-credentials"
          install -m 600 /dev/null "$store"
          printf 'https://x-access-token:%s@github.com\n' "$PRIVATE_DEPENDENCY_TOKEN" > "$store"
          git config --global credential.helper "store --file=$store"

      - name: Sync workspace toolchain
        run: make setup

      - name: Build site
        run: make docs APPLY=Y

      - name: Verify byte-identical repository
        run: |
          git diff --exit-code -- .
          git diff --cached --exit-code -- .

      # Pages configure/upload exist only to feed deploy on main. Running them on
      # every integration push fails closed when Pages is unset and is wasted
