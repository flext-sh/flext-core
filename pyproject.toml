# [MANAGED] ruff
[tool.ruff]
exclude = [
  "**/.archive/**",
  "**/__pyrefly_virtual__/**",
  ".archive",
  ".archive/**",
  ".git",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
