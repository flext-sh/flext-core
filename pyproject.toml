# [MANAGED] pytest
[tool.pytest.ini_options]
addopts = [
  "--benchmark-disable",
  "--durations=10",
  "--markdown-docs",
  "--strict-markers",
  "--timeout=10",
]
enable_assertion_pass_hook = true
filterwarnings = [
  "error",
  "module::flext_core._constants.enforcement.FlextMroViolation",
]
flext_slow_timeout_seconds = "60"
markers = [
  "advanced: advanced pattern tests",
  "architecture: architectural pattern tests",
  "core: core functionality tests",
  "coverage: coverage-focused tests",
  "ddd: domain-driven design tests",
  "docker: tests requiring Docker",
  "e2e: end-to-end integration tests",
  "edge_cases: edge case tests",
  "integration: integration tests",
  "performance: performance and benchmark tests",
  "remote: tests requiring remote/external network services",
  "resilience: resilience tests",
  "slow: slow-running tests",
  "smoke: public-interface smoke tests",
  "stress: stress tests",
  "unit: unit tests",
]
minversion = "8.0"
python_classes = ["Test*"]
python_files = ["*_test.py", "*_tests.py", "test_*.py"]
testpaths = ["tests"]

