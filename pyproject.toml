# [MANAGED] pyright
[tool.pyright]
# FLEXT Pyright suppression rationale (validated at the facade-FLEXT boundary):
# FLEXT pyright[reportAssignmentType]: Pyright rejects the canonical class-alias rebind after FLEXT facade composition although runtime and the other analyzers resolve it.
# FLEXT pyright[reportGeneralTypeIssues]: Pyright groups the same valid FLEXT facade alias rebind under its broad general diagnostic in every execution environment.
exclude = [
  "**/.*",
  "**/.mypy_cache",
  "**/.pytest_cache",
  "**/.ruff_cache",
  "**/.venv",
  "**/.venv/**",
  "**/__pycache__",
  "**/__pyrefly_virtual__/**",
