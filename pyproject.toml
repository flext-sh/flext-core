[tool.uv.exclude-dependencies.package]
name = "flext-cli"

[tool.uv.exclude-newer-package]
cryptography = false

[tool.vulture]
exclude = ["*/_protocols/*"]
min_confidence = 100
paths = ["src"]
verbose = false

