# @flext-managed: continuous
# @flext-regenerate: make deps WHAT=upgrade APPLY=Y
# @flext-ssot: flext-infra/src/flext_infra/_constants/deps.py
# @flext-ssot-dependencies: flext-infra/config/codegen.yaml (project_defaults.dev, dependency_profiles)
# @flext-maintenance: do not edit managed sections; edit the SSOT
# [MANAGED] FLEXT pyproject standardization
# Sections with [MANAGED] are enforced by flext_infra.deps.modernizer.
# Sections with [CUSTOM] are project-specific extension points.

# [CUSTOM] project metadata
[project]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Pydantic :: 2",
  "Framework :: Pydantic",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Typing :: Typed",
]
dependencies = [
  "beartype>=0.22.9",
  "cachetools>=6.2.6",
  "dependency-injector>=4.49.1",
  "docker>=7.2.0",
  "limits>=5.8.0",
  "orjson>=3.12.0",
  "packaging>=26.3",
  "pybreaker>=1.4.1",
  "pydantic>=2.13.4",
  "pydantic-core>=2.46.4",
  "pydantic-extra-types[semver]>=2.11.1",
  "pydantic-settings>=2.15.0",
  "python-dotenv>=1.2.3",
  "python-on-whales>=0.81.0",
  "pyyaml>=6.0.3",
  "rope>=1.14.0",
  "structlog>=26.1.0",
  "tomlkit>=0.15.1",
  "wrapt>=2.3.0",
]
description = "Enterprise Foundation Framework - Modern Python 3.13 + Clean Architecture"
keywords = [
  "clean-architecture",
  "ddd",
  "enterprise",
  "flext",
  "modern",
  "solid",
]
license = "MIT"
name = "flext-core"
readme = "README.md"
requires-python = ">=3.13,<3.14"
version = "0.12.0rc0"

[[project.authors]]
email = "team@flext.sh"
name = "FLEXT Team"

[[project.maintainers]]
email = "team@flext.sh"
name = "FLEXT Team"

# [MANAGED] consolidated development dependencies
[project.optional-dependencies]

[project.urls]
Documentation = "https://github.com/flext-sh/flext-core/blob/main/README.md"
Homepage = "https://github.com/flext-sh/flext-core"
Repository = "https://github.com/flext-sh/flext-core"

# [MANAGED] build system
[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.bandit]
severity = "MEDIUM"
skips = ["B101"]
targets = ["src"]

# [MANAGED] codespell
[tool.codespell]
check-filenames = true
ignore-words-list = "crate,nd"

# [MANAGED] coverage
[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if _t.TYPE_CHECKING:",
  "if typing.TYPE_CHECKING:",
]
fail_under = 45
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.run]
omit = [
  "*/_protocols/*",
  "*/dependency_injector/providers.pyx",
  "*/protocols.py",
]
source = ["src"]

# [MANAGED] deptry
[tool.deptry]
known_first_party = ["flext_cli", "flext_core", "flext_infra", "flext_tests"]
pep621_dev_dependency_groups = ["dev"]

[tool.flext.docs]
project_class = "platform"

[tool.hatch.build.targets.sdist]
only-include = ["config", "src/flext_core"]

[tool.hatch.build.targets.wheel]
packages = ["src/flext_core"]

[tool.hatch.build.targets.wheel.force-include]
config = "flext_core/config"

[tool.hatch.metadata]
allow-direct-references = true

[tool.interrogate]
fail-under = 70
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-module = false
ignore-private = true
ignore-property-decorators = true

# [MANAGED] mypy
[tool.mypy]
# FLEXT mypy suppression rationale (validated at the facade-FLEXT boundary):
# FLEXT mypy[assignment]: Dependency-injector descriptors lose their FLEXT-bound type only in Mypy.
# FLEXT mypy[attr-defined]: PEP 562 facade members installed by FLEXT composition are invisible to Mypy.
# FLEXT mypy[call-arg]: Pydantic v2 init signatures behind facade FLEXT are incomplete in Mypy.
# FLEXT mypy[misc]: Valid PEP 695 nested facade aliases are rejected under Mypy's misc bucket.
# FLEXT mypy[name-defined]: Generated PEP 562 exports are installed at runtime but absent to Mypy.
# FLEXT mypy[prop-decorator]: Mypy loses Pydantic computed-field descriptors across composed FLEXT.
# FLEXT mypy[valid-type]: Mypy rejects facade namespaces used as owners in valid PEP 695 aliases.
check_untyped_defs = true
disable_error_code = [
  "assignment",
  "attr-defined",
  "call-arg",
  "misc",
  "name-defined",
  "prop-decorator",
  "valid-type",
]
explicit_package_bases = true
extra_checks = true
follow_imports = "normal"
ignore_missing_imports = true
local_partial_types = true
mypy_path = ["src", ".", "scripts"]
namespace_packages = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]
python_version = "3.13"
show_traceback = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
disable_error_code = ["unreachable"]
module = ["dcdoc._utilities._charts._matplotlib_renderer._renders_spec"]

# [MANAGED] pydantic-mypy
[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

# [MANAGED] pyrefly
[tool.pyrefly]
disable-project-excludes-heuristics = true
project-excludes = [
