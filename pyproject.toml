[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Pydantic :: 2",
  "Framework :: Pydantic",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Typing :: Typed",
]
dependencies = [
  "annotated-types>=0.8.0",
  "beartype>=0.22.9",
  "dependency-injector>=4.49.1",
  "packaging>=26.3",
  "pydantic>=2.13.5",
  "pydantic-settings>=2.15.0",
  "pyyaml>=6.0.3",
  "structlog>=25.5.0,<26",
  "typing-extensions>=4.16.0",
]
description = "Enterprise Foundation Framework - Modern Python 3.13 + Clean Architecture"
keywords = [
  "clean-architecture",
  "ddd",
  "enterprise",
  "flext",
  "modern",
  "solid",
]
license = "MIT"
name = "flext-core"
readme = "README.md"
requires-python = ">=3.13,<3.14"
version = "0.12.0"

[[project.authors]]
email = "team@flext.sh"
name = "FLEXT Team"

[[project.maintainers]]
email = "team@flext.sh"
name = "FLEXT Team"

[project.scripts]
flext-core = "flext_core.cli:main"

[project.urls]
Documentation = "https://github.com/flext-sh/flext-core/blob/main/README.md"
Homepage = "https://github.com/flext-sh/flext-core"
Repository = "https://github.com/flext-sh/flext-core"

[dependency-groups]
codegen = [
  "flext-infra @ git+https://github.com/flext-sh/flext-infra.git@0.12.0-dev",
]
dev = [
  "actionlint-py>=1.7.12.24",
  "bandit>=1.9.4",
  "deptry",
  "flext-tests @ git+https://github.com/flext-sh/flext-tests.git@0.12.0-dev",
  "hypothesis",
  "mkdocs",
  "mkdocs-autorefs",
  "mkdocs-exclude>=1.0.2",
  "mkdocs-git-revision-date-localized-plugin>=1.5.4",
  "mkdocs-material>=9.7.7",
  "mkdocs-mermaid2-plugin>=1.2.3",
  "mkdocs-minify-plugin>=0.8.0",
  "mkdocs-redirects>=1.2.3",
  "mkdocs-section-index>=0.3.12",
  "mkdocstrings>=1.0.6",
  "mkdocstrings-python>=2.0.8",
  "mypy>=2.3.1",
  "pymdown-extensions",
  "pyrefly>=1.2.0",
  "pyright>=1.1.411",
  "pytest>=9.1.1",
  "pytest-asyncio",
  "pytest-benchmark",
  "pytest-cov",
  "pytest-markdown-docs",
  "pytest-randomly>=4.1.0",
  "pytest-testmon>=2.2.0",
  "pytest-timeout",
  "pytest-xdist",
  "ruff>=0.16.5",
  "rumdl>=0.2.62",
  "types-cachetools>=7.0.0.20260713",
  "types-cffi>=2.1.0.20260827",
  "types-click>=7.1.8",
  "types-defusedxml>=0.7.0.20260504",
  "types-docker>=7.2.0.20260827",
  "types-flask>=1.1.6",
  "types-jsonschema>=4.26.0.20260518",
  "types-ldap3>=2.9.13.20260827",
  "types-openpyxl>=3.1.5.20260827",
  "types-paramiko>=5.0.0.20260724",
  "types-protobuf>=7.35.1.20260827",
  "types-psutil>=7.2.2.20260827",
  "types-psycopg2>=2.9.21.20260724",
  "types-pyasn1>=0.6.0.20260724",
  "types-pyopenssl>=24.1.0.20240722",
  "types-python-dateutil>=2.9.0.20260807",
  "types-pyyaml>=6.0.12.20260815",
  "types-redis>=4.6.0.20241004",
  "types-requests>=2.33.0.20260712",
  "types-setuptools>=84.0.0.20260812",
  "types-tabulate>=0.10.0.20260508",
  "types-toml>=0.10.8.20260518",
  "vulture>=2.16",
  "yamlfix>=1.19.1",
]

[tool.codespell]
check-filenames = true
ignore-words-list = "crate,nd"

[tool.coverage.report]
exclude_also = [
  "if _t.TYPE_CHECKING:",
  "if TYPE_CHECKING:",
  "if typing.TYPE_CHECKING:",
]
fail_under = 45
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.run]
source = ["src"]
omit = [
  "*/dependency_injector/providers.pyx",
  "*/protocols.py",
  "*/_protocols/*",
]

[tool.deptry]
known_first_party = ["flext_core"]
pep621_dev_dependency_groups = ["dev"]

[tool.flext.docs]
project_class = "platform"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/flext_core"]

[tool.hatch.build.targets.wheel.force-include]
config = "flext_core/config"

[tool.hatch.build.targets.sdist]
only-include = ["src/flext_core", "config"]

[tool.mypy]
disable_error_code = [
  "assignment",
  "attr-defined",
  "call-arg",
  "misc",
  "name-defined",
  "prop-decorator",
  "valid-type",
]
exclude = ""
mypy_path = ["src"]
plugins = ["pydantic.mypy"]
python_version = "3.13"
check_untyped_defs = true
explicit_package_bases = true
extra_checks = true
follow_untyped_imports = true
local_partial_types = true
namespace_packages = true
no_implicit_reexport = true
show_traceback = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true
follow_imports = "normal"

[[tool.mypy.overrides]]
module = ["dcdoc._utilities._charts._matplotlib_renderer._renders_spec"]
disable_error_code = ["unreachable"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pyrefly]
disable-project-excludes-heuristics = true
project-excludes = [
  "**/*_pb2*.py",
  "**/*_pb2_grpc*.py",
  "**/.venv/**",
  "**/__pycache__",
  "**/__pyrefly_virtual__/**",
  "**/node_modules",
  "**/site-packages/**",
  "**/typings/**",
  "**/vendor/**",
  "**/venv/**",
  ".venv/**",
  "typings/**",
  "vendor/**",
]
project-includes = ["src/**/*.py*", "tests/**/*.py*"]
python-version = "3.13"
search-path = ["src", "."]
use-ignore-files = false

[tool.pyrefly.errors]
bad-argument-count = "error"
bad-argument-type = "error"
bad-assignment = "error"
bad-class-definition = "error"
bad-context-manager = "error"
bad-dunder-all = "error"
bad-function-definition = "error"
bad-index = "error"
bad-instantiation = "error"
bad-keyword-argument = "error"
bad-match = "error"
bad-param-name-override = "error"
bad-raise = "error"
bad-return = "error"
bad-specialization = "error"
bad-typed-dict = "error"
bad-typed-dict-key = "error"
bad-unpacking = "error"
deprecated = "error"
implicit-abstract-class = "error"
implicit-any = "error"
implicit-import = "error"
implicitly-defined-attribute = "error"
inconsistent-inheritance = "error"
inconsistent-overload = "error"
inconsistent-overload-default = "error"
invalid-annotation = "error"
invalid-argument = "error"
invalid-decorator = "error"
invalid-inheritance = "error"
invalid-literal = "error"
invalid-overload = "error"
invalid-param-spec = "error"
invalid-pattern = "error"
invalid-self-type = "error"
invalid-super-call = "error"
invalid-type-alias = "error"
invalid-type-var = "error"
invalid-type-var-tuple = "error"
invalid-variance = "error"
invalid-yield = "error"
missing-argument = "error"
missing-attribute = "error"
missing-import = "error"
missing-module-attribute = "error"
missing-override-decorator = "error"
missing-source = "error"
missing-source-for-stubs = "error"
no-access = "error"
no-matching-overload = "error"
not-a-type = "error"
not-async = "error"
not-callable = "error"
not-iterable = "error"
not-required-key-access = "error"
open-unpacking = "error"
protocol-implicitly-defined-attribute = "error"
read-only = "error"
redefinition = "error"
redundant-cast = "error"
redundant-condition = "error"
unannotated-attribute = "error"
unannotated-parameter = "error"
unannotated-return = "error"
unbound-name = "error"
unexpected-keyword = "error"
unexpected-positional-argument = "error"
unknown-name = "error"
unnecessary-comparison = "error"
unnecessary-type-conversion = "error"
unreachable = "error"
unresolvable-dunder-all = "error"
unsafe-overlap = "error"
unsupported = "error"
unsupported-delete = "error"
unsupported-operation = "error"
untyped-import = "error"
unused-coroutine = "error"
unused-ignore = "error"
variance-mismatch = "error"

[tool.pyright]
exclude = [
  "**/.*",
  "**/.mypy_cache",
  "**/.pytest_cache",
  "**/.ruff_cache",
  "**/.venv",
  "**/.venv/**",
  "**/__pycache__",
  "**/__pyrefly_virtual__/**",
  "**/dist-packages",
  "**/dist-packages/**",
  "**/node_modules",
  "**/site-packages",
  "**/site-packages/**",
  "**/tests/fixtures",
  "**/tests/fixtures/**",
  "**/venv",
  "**/venv/**",
  ".git",
  ".reports",
  ".venv",
  "vendor",
]
include = ["src", "tests"]
extraPaths = ["src", "."]
pythonPlatform = "Linux"
pythonVersion = "3.13"
reportArgumentType = "none"
reportAttributeAccessIssue = "none"
reportCallIssue = "none"
reportConstantRedefinition = "error"
reportIncompatibleMethodOverride = "error"
reportIncompatibleVariableOverride = "none"
reportInconsistentConstructor = "error"
reportInvalidTypeForm = "none"
reportMissingImports = "error"
reportMissingModuleSource = "error"
reportMissingTypeStubs = "none"
reportPrivateUsage = "warning"
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportUnknownVariableType = "none"
reportUnnecessaryCast = "error"
reportUnnecessaryComparison = "warning"
reportUnnecessaryIsInstance = "warning"
reportUnreachable = "none"
reportUnsupportedDunderAll = "none"
reportUntypedBaseClass = "none"
reportUntypedFunctionDecorator = "none"
reportUnusedClass = "error"
reportUnusedFunction = "error"
reportUnusedImport = "error"
reportUnusedVariable = "error"
typeCheckingMode = "strict"

[[tool.pyright.executionEnvironments]]
root = "src"
extraPaths = ["src"]
reportAssignmentType = "none"
reportAttributeAccessIssue = "none"
reportGeneralTypeIssues = "none"
reportInvalidTypeForm = "none"
reportPrivateImportUsage = "none"
reportPrivateUsage = "error"
reportReturnType = "none"
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportUnknownVariableType = "none"
reportUnusedImport = "none"

[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = [".", "src"]
reportArgumentType = "none"
reportAssignmentType = "none"
reportAttributeAccessIssue = "none"
reportGeneralTypeIssues = "none"
reportInvalidTypeForm = "none"
reportPrivateImportUsage = "none"
reportPrivateUsage = "none"
reportReturnType = "none"
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportUnknownVariableType = "none"
reportUnusedImport = "none"

[tool.pytest.ini_options]
addopts = [
  "--benchmark-disable",
  "--strict-markers",
  "--markdown-docs",
  "--durations=10",
  "--timeout=10",
]
flext_slow_timeout_seconds = "60"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "error",
  "module::flext_core._constants.enforcement.FlextMroViolation",
]
markers = [
  "smoke: public-interface smoke tests",
  "unit: unit tests",
  "integration: integration tests",
  "performance: performance and benchmark tests",
  "slow: slow-running tests",
  "docker: tests requiring Docker",
  "remote: tests requiring remote/external network services",
  "e2e: end-to-end integration tests",
  "edge_cases: edge case tests",
  "stress: stress tests",
  "resilience: resilience tests",
]
minversion = "8.0"
python_classes = ["Test*"]
python_files = ["*_test.py", "*_tests.py", "test_*.py"]
testpaths = ["tests"]

[tool.ruff]
exclude = [
  "**/.archive/**",
  "**/__pyrefly_virtual__/**",
  "**/aihub-hooks/**",
  ".archive",
  ".archive/**",
  ".git",
  ".github/hooks",
  ".github/hooks/**",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  "__pycache__",
  "archive",
  "backup",
  "build",
  "dist",
  "htmlcov",
  "temp-backup",
  "typings",
  "vendor",
  "venv",
]
fix = false
line-length = 88
preview = true
respect-gitignore = true
show-fixes = true
src = ["examples", "scripts", "src", "tests"]
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "lf"
quote-style = "double"
skip-magic-trailing-comma = true

[tool.ruff.lint]
ignore = [
  "ambiguous-unicode-character-comment",
  "ambiguous-unicode-character-docstring",
  "ambiguous-unicode-character-string",
  "boolean-positional-value-in-call",
  "camelcase-imported-as-lowercase",
  "complex-structure",
  "docstring-missing-exception",
  "docstring-missing-returns",
  "docstring-missing-yields",
  "import-outside-top-level",
  "incorrect-blank-line-before-class",
  "line-too-long",
  "logging-f-string",
  "missing-copyright-notice",
  "missing-trailing-comma",
  "multi-line-summary-second-line",
  "no-self-use",
  "non-imperative-mood",
  "pytest-fixture-autouse",
  "relative-imports",
  "too-many-arguments",
  "too-many-branches",
  "too-many-locals",
  "too-many-nested-blocks",
  "too-many-positional-arguments",
  "too-many-public-methods",
  "too-many-return-statements",
  "too-many-statements",
  "typing-only-first-party-import",
  "typing-only-standard-library-import",
  "typing-only-third-party-import",
]
select = ["ALL"]

[tool.ruff.lint.flake8-tidy-imports.banned-api.argparse]
msg = "Use cli.register_result_command + Pydantic model from flext_cli."

[tool.ruff.lint.flake8-tidy-imports.banned-api.click]
msg = "Use flext_cli.cli application, registration, execution, and invocation methods."

[tool.ruff.lint.flake8-tidy-imports.banned-api.rich]
msg = "Use cli.print / cli.display_message / cli.render_panel / cli.render_table."

[tool.ruff.lint.flake8-tidy-imports.banned-api.typer]
msg = "Use cli.create_app_with_common_params / cli.register_command from flext_cli."

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
known-first-party = ["flext_core"]
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = [
  "any-type",
  "builtin-import-shadowing",
  "implicit-namespace-package",
  "import-private-name",
  "invalid-module-name",
  "non-empty-init-module",
  "runtime-import-in-type-checking-block",
  "undefined-export",
  "undefined-local-with-import-star",
  "undefined-local-with-import-star-usage",
  "undocumented-public-init",
  "unused-import",
]
"**/examples/**/*.py" = ["invalid-module-name", "shebang-not-executable"]
"**/tests/**" = [
  "assert",
  "compare-to-empty-string",
  "magic-value-comparison",
  "undocumented-public-class",
  "undocumented-public-function",
  "undocumented-public-method",
]

[tool.tomlsort]
all = true
in_place = true
sort_first = ["project", "build-system", "tool", "dependency-groups"]

[tool.vulture]
exclude = ["*/_protocols/*"]
min_confidence = 100
paths = ["src"]
verbose = false

[tool.yamlfix]
explicit_start = false
line_length = 88
preserve_quotes = true
section_whitelines = 1
whitelines = 1

[tool.uv]
link-mode = "copy"
constraint-dependencies = ["structlog<26"]
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]

[[tool.uv.exclude-dependencies]]
dependencies = ["flext-core"]

[tool.uv.exclude-dependencies.package]
name = "flext-infra"

[[tool.uv.exclude-dependencies]]
dependencies = ["flext-core"]

[tool.uv.exclude-dependencies.package]
name = "flext-tests"

[[tool.uv.exclude-dependencies]]
dependencies = ["flext-core"]

[tool.uv.exclude-dependencies.package]
name = "flext-cli"
[tool.bandit]
severity = "MEDIUM"
skips = ["B101"]
targets = ["src"]

[tool.interrogate]
fail-under = 70
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-module = false
ignore-private = true
ignore-property-decorators = true

[tool.radon]
cc_min = "B"
mi_min = "B"
