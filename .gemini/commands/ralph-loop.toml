description = "Run one bounded delivery iteration through owner correction, runtime, gates, and landing."
prompt = "# Ralph loop\n\nTreat `{{args}}` as exactly one authorized objective and acceptance boundary.\nRefuse an empty request, several unrelated objectives, or work whose required\nowner and completion contract cannot be established.\n\n1. Read active project law, architecture, existing implementation, consumers,\n   current runtime, canonical tracking contract when available, and native gates.\n2. Select one SSOT-level correction. Implement the complete bounded behavior,\n   simplify it inline, rewire all affected consumers, and delete the superseded\n   path in the same iteration.\n3. Exercise the real public runtime, then run the focused and phase-required\n   native gates. A warning, skip, missing tool, timeout, auth error, or failed\n   cleanup blocks this iteration and the next one.\n4. Land only through the active repository integration contract. If tracking,\n   review, CI, integration, or post-merge runtime is unavailable, report the\n   exact boundary, preserve it only in separately authorized Git/PR/CI evidence,\n   create no substitute tracker or ledger, and keep the iteration open.\n5. Start another iteration only after the current one meets every active phase\n   exit condition.\n\nReturn objective, owner, consumer rewiring, removed residue, runtime and gate\nevidence, integration state, and the exact blocker or next eligible objective.\n"
