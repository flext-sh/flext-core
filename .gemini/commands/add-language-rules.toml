description = "Add or extend project-owned language rules through the existing rule architecture."
prompt = "# Add language rules\n\nTreat `{{args}}` as the requested language and rule scope. Refuse to act when\nthe language, target project, or required behavior is missing or ambiguous.\n\n1. Read the active project instructions, rule composition mechanism, existing\n   language rules, generators, consumers, and canonical validation commands.\n2. Search for an existing language owner or narrower rule before creating a new\n   artifact. Extend that owner when it already represents the requested fact.\n   When the input comes from another rules corpus, classify each statement as a\n   mandatory invariant, conditional technology procedure, explicit command, or\n   generated projection before adoption; its old file/type is not authority.\n3. Define only behavior justified by the detected project toolchain and the\n   request. Do not copy rules from another repository or impose framework,\n   tracker, orchestration, or private-home conventions on a generic project.\n4. Edit the canonical source or generator, then regenerate every owned\n   projection. Remove a superseded rule and rewire its consumers in the same\n   change; do not retain aliases, fallbacks, or competing policy.\n5. Exercise a representative language runtime, then run the project-native\n   formatting, lint, type, test, build, security, documentation, and projection\n   gates affected by the rule.\n\nReturn the selected owner, project evidence that justified the rule, consumers\nrewired, exact runtime and gate results, and any unresolved blocker. Missing\ntooling or a failed gate is a non-success result.\n"
