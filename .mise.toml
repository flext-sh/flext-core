# NOTE: mise carries the Python runtime and native tools from the config SSOT.
# Python dependency declarations remain owned by pyproject.toml. Tools are declared
# `latest`; only `make upg` resolves them and writes the committed mise.lock.
# Setup installs frozen from that lock and never re-resolves.

# === SECTION: settings (managed) ===
# Source: config:codegen.toolchain.mise_lockfile / mise_locked / mise_lockfile_platforms /
#         dependency_cooldown_days (one fleet supply-chain cooldown, operator 2026-10-01)
[settings]
minimum_release_age = "7d"
lockfile = true
locked = true
lockfile_platforms = ["linux-x64", "linux-x64-musl", "linux-arm64", "macos-x64", "macos-arm64", "windows-x64"]
[settings.python]
compile = false
[settings.npm]
# bun installs the npm CLIs with the --trust lifecycle approval the inline
# tool below declares; the lock keeps the top-level pin only.
package_manager = "bun"
[tool_config]
locked = true
# End SECTION: settings

# === SECTION: tools (managed) ===
# Source: config:python_version + config:codegen.toolchain.tools entries
#         (name, selector, version, version_prefix, form; entry order is the
#         projection order, form fixes the rendered shape)
[tools]
python = "3.13"
# Native toolchain (single source: Infra.codegen.toolchain.tools in codegen.yaml).
uv = "latest"
kubectl = "latest"
helm = "latest"
kind = "latest"
direnv = "latest"
taplo = "latest"
"npm:@ast-grep/cli" = { version = "latest", bun_args = "--trust" }
gitleaks = "latest"
"aqua:boyter/scc" = "latest"
kubeconform = "latest"
node = "latest"
bun = "latest"
"npm:prettier" = "3.9.9"
go = "latest"
make = "latest"
[tools."github:qltysh/qlty"]
version = "0.645.0"
[tools."github:kucherenko/jscpd"]
version = "5.3.2"
[tools."github:microsoft/waza"]
version = "latest"
version_prefix = "v"
